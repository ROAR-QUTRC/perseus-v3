generic_controller:
  ros__parameters:
    max_update_rate: 20
    turbo_scaling: 2.0
    drive:
      forward:
        turbo: 2.5
        axis: 1
        # Positive scaling: joystick forward = positive linear.x = forward (ROS convention)
        scaling: 0.7
        enable:
          axis: 2
          is_less_than: true
          threshold: -0.5
        turbo_enable:
          axis: 5
          is_less_than: true
          threshold: -0.5
      turn:
        turbo: 2.5
        axis: 3
        # Positive scaling: joystick left = positive angular.z = turn left (ROS convention)
        # Dual-stick: right stick X for turning
        scaling: 0.5
        enable:
          follows: drive.forward.enable
        turbo_enable:
          follows: drive.forward.turbo_enable
    # Only while drive.forward.enable (the drive deadman) is held - see generic_controller.
    bucket:
      lift:
        scaling: 0.1
        button_positive: 3
        button_negative: 0
      tilt:
        scaling: -0.1
        button_positive: 2
        button_negative: 1
      jaws:
        scaling: 0.1
        button_positive: 5
        button_negative: 4
      rotate:
        scaling: -0.5
        axis: 6
    # How long /joy can go quiet before the drive and bucket stop. Matches twist_mux's
    # joy_vel timeout; 150 ms (joy_node publishes at ~20 Hz) dropped out mid-drive.
    timeout_ns: 500000000
