generic_controller:
  ros__parameters:
    max_update_rate: 20
    turbo_scaling: 2.0
    # How long /joy can go quiet before the drive and bucket stop. Matches twist_mux's
    # joy_vel timeout; 150 ms (joy_node publishes at ~20 Hz) dropped out mid-drive.
    timeout_ns: 500000000
    drive:
      forward:
        turbo: -2.5
        axis: 0
        scaling: -0.7
        enable:
          axis: 4
          is_less_than: true
          threshold: -0.2
        turbo_enable:
          axis: 5
          is_less_than: true
          threshold: -0.2
      turn:
        turbo: 2.5
        axis: 2
        scaling: 1.0
        enable:
          follows: drive.forward.enable
        turbo_enable:
          follows: drive.forward.turbo_enable
    # Only while drive.forward.enable (the drive deadman) is held - see generic_controller.
    bucket:
      lift:
        scaling: -0.8
        axis: 3
      tilt:
        scaling: 0.8
        axis: 1
      jaws:
        scaling: 0.1
        axis: 6
