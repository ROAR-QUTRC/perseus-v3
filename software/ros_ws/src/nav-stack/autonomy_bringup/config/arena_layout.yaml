# Arena layout for the 2026 NASA International Lunabotics Championship.
#
# Every coordinate here is in the ARENA frame, which is the guidebook's Origin
# Point: the centre of the front (south) arena wall, +X east, +Y north, Z up at
# grade. arena_server publishes that frame as map -> odom, so once a fix exists
# these numbers are directly usable as navigation goals.
#
# PROVISIONAL. Guidebook section 3.1 says the layout images are "placeholders
# from the prior two-team arena configuration and will be updated when the final
# International Championship arena layout is released", and section 5.7 says the
# same of the fiducial rail. The prose also disagrees with Figure 2 on arena size
# - "~10 m long and ~10 m wide" against a dimensioned 9.14 x 8.10 m bed. This
# file exists so that when v2 lands there is one place to re-measure into.
arena_server:
  ros__parameters:
    # Frames. map is the arena frame above; the node estimates and broadcasts
    # map -> odom and never touches odom -> base_link, which the EKF owns.
    map_frame: "map"
    odom_frame: "odom"
    base_frame: "base_link"
    # Where the rover is in the arena at startup, before any fiducial fix.
    #
    # This seeds map -> odom so the zone layout is usable immediately and callers
    # can plan without first calling /arena/localise. It is an assumption, not a
    # measurement: the guidebook (5.4.4) says the starting position and direction
    # are "randomly selected immediately before the competition attempt", so on
    # competition day this will be wrong and a fiducial fix has to correct it.
    # The default is the centre of the starting zone facing north into the arena,
    # which is also where perseus_simulation spawns the rover.
    initial_pose:
      x: -1.125
      y: 1.125
      yaw: 1.5708
    # Publish the seeded transform straight away rather than waiting for a fix.
    # Turn this off if you would rather have no map frame at all than a wrong
    # one - a stale map -> odom is worse than none when the error is unbounded.
    publish_initial_pose: true
    # Rate at which map -> odom is rebroadcast. The transform only changes when a
    # fix is accepted; this is just keeping it fresh in the tf buffer.
    broadcast_rate_hz: 20.0
    # ─── Layout ───────────────────────────────────────────────────────────────
    # Zones and fiducial positions live in arena_layout.json, not here, so the
    # base station's minimap can read byte-for-byte the same file. Nothing about
    # the arena is duplicated in this YAML; what stays here is node behaviour.
    #
    # layout_file is deliberately NOT set here: the launch file resolves it
    # through FindPackageShare and passes it as an override, because a path
    # hard-coded in a config is wrong the moment the workspace moves. The node
    # refuses to start without it rather than falling back to a built-in layout,
    # since a silently-wrong arena is worse than no arena.

    # ─── Localisation service ─────────────────────────────────────────────────
    # The camera is lazy in simulation, so nothing renders between requests. The
    # node subscribes on demand and waits this long for frames to appear.
    default_localise_timeout_s: 2.0
    detections_topic: "/vision/aruco/detections"
    # Candidate fixes from individual markers must agree within these before any
    # of them is accepted. Single-marker pose is occasionally catastrophic -
    # measured up to 9.4 degrees of yaw error while looking perfectly confident -
    # so agreement between markers, not confidence from one, is what qualifies a
    # fix.
    agreement_position_m: 0.25
    agreement_yaw_deg: 5.0
    # ─── RViz display ─────────────────────────────────────────────────────────
    # Zone outlines are published once, latched, on zones_topic as a MarkerArray
    # in the map frame. Add a MarkerArray display in RViz pointed at that topic;
    # because it is transient-local you get the zones immediately on connecting
    # rather than waiting for a redraw.
    #
    # Zones are drawn as translucent upright walls, not as outlines on the
    # ground. A flat outline at grade vanishes the moment a 3D terrain mesh is
    # displayed over it, being coplanar with the thing hiding it; walls stand
    # clear of the mesh and the alpha lets you see the arena through them.
    #
    # The base sits slightly below grade so the walls are not cut off where the
    # regolith rises - the sim's bed has about 0.3 m of relief centred on z = 0.
    zones_topic: "/arena/zones"
    zone_wall_base_m: -0.15
    zone_wall_height_m: 0.75
    zone_wall_thickness_m: 0.04
    zone_wall_alpha: 0.35
    # Labels are useful when first checking the layout and clutter afterwards.
    zone_labels: true
    # The topic is transient local, but RViz's MarkerArray display subscribes
    # VOLATILE by default and so never sees a message published before it
    # connected. Republishing covers that without anyone having to change the
    # display's QoS. 0 publishes once only.
    zone_republish_hz: 1.0
    # ─── Zone waypoint services ───────────────────────────────────────────────
    # /arena/request_excavation_waypoint and /arena/request_construction_waypoint
    # each return one safe point inside their zone, scored against this costmap.
    #
    # Set false to skip the costmap entirely and always return the zone centre -
    # e.g. before global_traversability is up, or to check the services against
    # the zone geometry alone without waiting on a costmap.
    use_costmap: true
    # global_traversability's final nav2-consumable costmap (autonomy_bringup's
    # navigation.yaml points nav2's own static layer at the same topic).
    costmap_topic: "/costmap"
    # Candidate spacing when searching a zone, independent of the costmap's own
    # resolution (0.1 m by default) so this stays cheap even if that changes.
    waypoint_sample_resolution_m: 0.2
    # Above this costmap value (0-100) a candidate is rejected. 100 is a
    # confirmed obstacle cell; below that the value decays with distance from
    # the nearest one, so this leaves real margin rather than only excluding
    # literal obstacle cells - see global_traversability's _compute_final_cost.
    waypoint_max_cost: 50.0
    # Weights for choosing among candidates under waypoint_max_cost: cost_weight
    # favours a wider margin from obstacles, distance_weight favours a point
    # closer to the rover right now. Both are normalised (cost against its own
    # 0-100 range, distance against the zone's diagonal), so they default to
    # summing to 1.
    waypoint_cost_weight: 0.7
    waypoint_distance_weight: 0.3
    # Keeps the search off a zone's wall-adjacent sides (the ones
    # arena_layout.json's "edges" list leaves undrawn - see Zone::draw_north
    # etc in arena_layout.hpp). Without this, a zone's rectangle is searched
    # right up to the arena wall itself, which is both hard to manoeuvre
    # against and, since the waypoint faces the zone centre (see
    # _find_safe_point), the main thing standing between a wall-flush point
    # and a heading that clears the wall by a comfortable margin.
    #
    # excavation_zone only. construction_zone gets its own,
    # construction_wall_standoff_m, below - excavation_zone is 9.14 x 3.0 m,
    # construction_zone only 2.05 x 3.41 m, and one wall_standoff_m cannot
    # serve both: this value would leave construction_zone a 0.55 x 1.91 m
    # strip once its one walled side per axis is inset, which is what an
    # "arena_server: no free point ... found in zone 'construction_zone'"
    # warning after raising this usually means.
    wall_standoff_m: 1.0
    # construction_zone's own wall standoff - see wall_standoff_m above for why
    # this is a separate, much smaller parameter rather than reusing it.
    construction_wall_standoff_m: 0.7
    # Radius that must be entirely clear (see _area_clear in arena_server.cpp)
    # around the excavation waypoint, not just its own cell: digging there
    # means the rover then reverses and/or drives forward on the spot, which a
    # single clear cell says nothing about - a cell can be free with an
    # obstacle immediately beside it. 0 disables this, falling back to the
    # single-cell check. construction_zone gets no equivalent parameter: it is
    # a drop-off point, not somewhere the rover manoeuvres back and forth.
    excavation_clearance_radius_m: 1.3
    # Whether an unmapped cell (costmap value -1, or simply outside the area
    # the costmap currently covers) is treated as free rather than rejected -
    # both for a candidate's own cell and everywhere inside
    # excavation_clearance_radius_m of it. Off by default, matching
    # global_traversability's own treat_unknown_as_obstacle: ground nobody has
    # looked at yet could hide a rock or crater, so this trades that margin
    # for availability and should be turned on deliberately (e.g. a small,
    # already fully-surveyed test arena), not flipped to silence a "no free
    # point ... not yet mapped" warning without checking why coverage is
    # missing there first - a growing map (global_traversability's own
    # update_period_s) or the rover simply not having driven/looked that way
    # yet are both much more likely than the ground being unreachable.
    waypoint_unknown_is_free: true
    # target_berm_area (the scoring target, 5.2.2) sits almost centred inside
    # construction_zone, so without this the construction waypoint frequently
    # lands on top of it - including the use_costmap false fallback, which
    # would otherwise just return construction_zone's centre. Only the
    # construction service excludes anything; excavation_zone has no
    # equivalent zone to avoid.
    construction_avoid_zone_name: "target_berm_area"
