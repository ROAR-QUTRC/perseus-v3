# Everything navigation.launch.py brings up: the two terrain costmaps, the global planner,
# and the nav2 stack that drives to a goal.
#
# /livox/lidar -> global_traversability -> /costmap -> planner_server   -> /plan
#                                                   -> smoother_server
#                                                   -> controller_server -> /cmd_vel
#                                                   -> velocity_smoother -> /cmd_vel_nav_stamped
#                                                   -> twist_mux -> diff drive -> VESCs
#
#   /livox/lidar -> local_traversability -> /local_costmap_terrain -> controller_server
#
# THREE THINGS THAT ARE NOT OBVIOUS AND WILL COST YOU AN AFTERNOON:
#   * There is no map frame. BIEVR-LIO's world frame is odom; nothing publishes map->odom.
#     Every global_frame here is odom.
#   * twist_mux gives navigation priority 10 vs joystick 100 / web_ui 80. If either of those
#     publishes continuously, nav2 never reaches the wheels.
#   * The ESCs stall below ~0.34 rad/s at the wheel = 0.05 m/s at the tyre, 0.14 rad/s of
#     body yaw. Several nav2 defaults sit under that; the ones that matter are marked STALL.
# ============================================================================
# TERRAIN COSTMAP -- global_traversability
# ============================================================================
# The map-wide terrain the planner plans on. Built from the RAW Livox scan, not from
# /Laser_map: BIEVR-LIO is odometry only as far as navigation is concerned.
#
# WHY NOT THE LIO MAP. LIO z-wander writes the same floor into it several times, 5-10 cm
# apart, so a "lowest point in the cell" there is not the ground, and the map only ever
# grows, so an obstacle that leaves never clears. Measured on rosbag2_1970_01_01-10_31_15:
# min_clearance_m alone flagged 1079 cells of flat floor off that second copy.
#
# CLASSIFY SHORT, REMEMBER LONG. Every update_period_s it runs local_traversability's exact
# height-difference test (the classifier is literally shared, see terrain_analysis.hpp) over
# only the last point_buffer_s of scans -- drift-free by construction -- and folds each
# observed cell's verdict into a log-odds that persists. Cells the lidar cannot see keep
# their last value forever; cells it can see are re-decided, so a removed rock clears the
# next time the rover looks at that spot. It stores verdicts, never heights: a height grid
# stitched across minutes would read the drift between two visits as a step.
global_traversability:
  ros__parameters:
    pointcloud_topic: "/livox/lidar"
    # No map frame -- see the header of this file. Must match global_costmap's global_frame.
    global_frame: "odom"
    robot_frame: "base_footprint"
    resolution_m: 0.1
    # Starting size only. The grid grows by itself in 10 m steps whenever the scan window
    # reaches past its edge, logging "Grew terrain map to ..." each time.
    initial_map_length_m: 40.0
    # Classify + fuse. The window is ~21 m square at max_range_m 10, i.e. ~5.5x local's
    # cells at 1/5 of its rate -- about the same CPU. Raise this first if the Orange Pi
    # struggles.
    update_period_s: 0.5
    # Republish /costmap. Inflation and the OccupancyGrid conversion scale with the WHOLE
    # map, so this is the one to slow down once the map is arena-sized.
    publish_period_s: 1.0
    # The drift-free window. Same 1 s as local. With update_period_s 0.5 every scan is
    # classified twice, which the log-odds values below are tuned for.
    point_buffer_s: 1.0
    # Sensor-frame range gate. Further than local's 6 m because the planner needs to see
    # further than the controller; much past 10 m a 0.1 m grid is too sparse to judge.
    min_range_m: 1.0
    max_range_m: 10.0
    max_sensor_height_m: 1.5
    # THE CLASSIFIER, same meaning as the matching local_traversability parameters below --
    # read their comments there. Kept in step with local's so a cell does not change
    # verdict depending on which node saw it.
    ground_window_m: 0.5
    max_slope_deg: 40.0
    max_step_up_m: 0.2
    max_height_above_ground_m: 0.2
    max_step_down_m: 0.15
    obstacle_height_cap_m: 1.0
    ground_margin_m: 0.10
    # Disabled, for the same arithmetic reason as local's -- see there.
    min_clearance_m: 0.0
    # 2, against local's 1. This grid REMEMBERS: a lone return local would forget in a
    # second would stay here until the cell is rescanned.
    min_points_per_cell: 2
    min_obstacle_cells: 2
    # THE MEMORY. Each update a cell the window observes gets +hit (obstacle) or -miss
    # (free), clamped to [min, max]; above occupied it publishes as lethal. Cells the window
    # does not observe are left alone.
    #   hit > occupied   one sighting marks a rock. Missing one is worse than a false one
    #                    that clears on the next look.
    #   (max - occupied) / miss = updates of clear view to erase an obstacle: 7.5, ~4 s.
    #   (occupied - min) / hit  = updates to mark something new on long-free ground: ~4, ~2 s.
    log_odds_hit: 0.7
    log_odds_miss: 0.4
    log_odds_min: -2.0
    log_odds_max: 3.5
    log_odds_occupied: 0.5
    # false: never-observed cells publish as -1, not cost 100. One of three settings that
    # decide whether the rover may cross ground the lidar has never seen; the others are
    # allow_unknown and the costmaps' track_unknown_space. Search UNMAPPED for all three.
    treat_unknown_as_obstacle: false
    # Inflation, same semantics as nav2's InflationLayer. nav2 does NOT inflate on top of
    # this -- neither costmap loads an inflation layer.
    robot_radius_m: 0.5
    inflation_radius_m: 0.8
    cost_scaling_factor: 3.2
# ============================================================================
# REACTIVE TERRAIN COSTMAP -- local_traversability
# ============================================================================
# The other half of the terrain analysis: an 8 m window around the rover, rebuilt from the
# RAW Livox scan at 10 Hz. It does not replace global_traversability -- it is layered on top
# of it in local_costmap below, so the controller sees map-wide terrain plus whatever the
# lidar is looking at right now, at 10 Hz rather than the global node's 1 s republish.
# What the global map deliberately cannot do -- forget -- is this node's job: something
# that moved away is gone from here within point_buffer_s, where the global map keeps it
# until the lidar looks at that spot again.
#
# SAME CLASSIFIER, DIFFERENT MEMORY. Both nodes run the one height-difference test in
# terrain_analysis.hpp over the last 1 s of raw scans, which are drift-free, so the lowest
# return near a cell IS the ground near it. This node throws the verdicts away every
# update; the global node folds them into a persistent log-odds. The windowed height
# difference is also what makes a 10 Hz update fit on the Orange Pi at all, and it is
# deterministic.
local_traversability:
  ros__parameters:
    # Raw, not /Laser_map. Point this at /livox/lidar/filtered to run behind the dust
    # filter (sensors/config/dust_filter.yaml) if dust starts producing false obstacles.
    pointcloud_topic: "/livox/lidar"
    # Must match local_costmap's global_frame below, or its static layer silently drops
    # every grid this publishes. There is no map frame -- see the header of this file.
    global_frame: "odom"
    robot_frame: "base_footprint"
    resolution_m: 0.1
    # Square window side, and it should comfortably exceed local_costmap's 6 m width below
    # so the costmap is never reaching past the edge of what this publishes.
    map_length_m: 8.0
    # 10 Hz, matching the MID-360's own rate. Raise to 0.2 first if the Orange Pi is
    # struggling -- the ground pass below is the expensive part and it scales with this.
    update_period_s: 0.1
    # THE DENSITY/STALENESS TRADE, and the only state this node keeps. A single MID-360
    # sweep leaves most 0.1 m cells empty, so scans are pooled over this window; it is also
    # exactly how long something that has moved out of the way stays on the map. Shorten it
    # if the rover reacts to things that are no longer there, lengthen it if the grid is too
    # sparse to see obstacles at range.
    point_buffer_s: 1.0
    # Range gate, applied in the SENSOR frame before anything else. Below min_range the scan
    # is hitting the rover itself; max_range is kept inside map_length_m / 2 plus a margin
    # because returns outside the window are binned into nothing anyway.
    min_range_m: 1.0
    max_range_m: 6.0
    # Also in the sensor frame, so it is immune to LIO z-drift: drop anything this far above
    # the lidar. Canopy/ceiling returns would otherwise become a cell's maximum height.
    max_sensor_height_m: 1.5
    # THE GROUND REFERENCE. Radius of the window each cell's ground is taken from. Same trade
    # as the global node's ransac_patch_m: must be well clear of the 30-40 cm boulders or one
    # becomes its own ground and vanishes, small enough that real terrain inside is planar.
    # It is also the node's dominant cost -- the pass is O(cells * (2 * radius / res + 1)^2),
    # i.e. 121 neighbours per cell at 0.5 m and 0.1 m -- so this is the first dial to drop if
    # the update period cannot be met.
    ground_window_m: 0.5
    # NOT an obstacle test. It is the allowance subtracted from every height difference, so
    # ground legitimately rising at this rate reads as flat: a neighbour d metres away lets
    # this cell's ground sit d * tan(30 deg) higher without that counting as a step. Raising
    # it hides real steps at the window edge; lowering it flags open ground on a gradient.
    # Same 40 deg the global node uses for max_slope_deg, so the two agree on what a
    # drivable gradient is.
    max_slope_deg: 40.0
    # THE THREE VERTICAL TESTS, all height differences against that ground reference:
    #   max_step_up_m             the cell's own floor stands above surrounding ground --
    #                             a kerb, a rock the wheels would have to climb.
    #   max_height_above_ground_m something STANDS in the cell while its floor is still at
    #                             ground level -- a pole, a wall face, a thin obstacle. This
    #                             is the one that catches what step_up alone misses.
    #   max_step_down_m           the cell sits below surrounding ground -- a hole or a
    #                             drop-off. Weakest of the three: a real drop-off usually
    #                             shows as NO returns rather than low ones, so treat this as
    #                             a bonus and not as fall protection. Set 0.0 to disable.
    # Start looser than the global node's 0.20 would suggest and tighten: raw scans have no
    # map layering inflating these, so a real 0.12 m step here is a real 0.12 m step.
    max_step_up_m: 0.2
    max_height_above_ground_m: 0.2
    max_step_down_m: 0.15
    # Above this height a return is overhead structure and is left out of the height test
    # entirely, so the rover can drive under it. Whether it actually fits is min_clearance_m
    # below, which is a separate question and a separate test.
    obstacle_height_cap_m: 1.0
    # Overhead clearance. DISABLED (0.0), and not as a workaround -- given the other two
    # values it is arithmetically incapable of doing anything except generate noise.
    #
    # The test fires when some return sits between ground_margin_m (0.10) and
    # min_clearance_m above the ground. But any return below obstacle_height_cap_m (1.0)
    # already sets height_above_ground, which flags the cell above 0.12. So the only band
    # where clearance fires and the height test does not is 0.10 to 0.12 -- a 2 cm sliver
    # that contains nothing but sand roughness and LIO noise. Everything genuinely low
    # enough to hit is caught by the height test; everything high enough to drive under is
    # excluded by the cap.
    #
    # Measured, not assumed. An ablation over the live layers: of 37 flagged cells,
    # clearance fired on all 37 and was the SOLE cause on 35, with every value between
    # 0.10 and 0.12 -- i.e. entirely inside that sliver. step_up and step_down fired on
    # zero. Same failure the global node has (-1079 cells there), for a different reason.
    #
    # To give this test real work to do, lower obstacle_height_cap_m below min_clearance_m
    # so a band exists that only clearance covers. Do not simply re-enable it.
    ground_margin_m: 0.10
    min_clearance_m: 0.0
    # 1, against the global node's 2. One sweep over a 0.1 m grid is sparse enough that
    # demanding a second return mostly erases real, distant ground.
    min_points_per_cell: 1
    # Erase obstacle blobs smaller than this (8-connected). Needed for the opposite reason to
    # the global node's: not map layering, but the single spurious returns (dust, rain, a
    # specular surface) a raw scan has and an accumulated map has already averaged away.
    min_obstacle_cells: 2
    # false, and it matters more here than globally: most of a local window is unobserved at
    # any instant (occlusion, beyond range, behind the rover), and publishing that as lethal
    # would box the rover in every cycle. Unobserved cells publish -1, which reaches the
    # local costmap as free (track_unknown_space false) and, under use_maximum, leaves
    # whatever the global terrain map said about that cell untouched.
    treat_unknown_as_obstacle: false
    # Same inflation semantics and the same values as the global node, so a cell does not
    # change cost depending on which of the two saw it.
    robot_radius_m: 0.5
    inflation_radius_m: 0.8
    cost_scaling_factor: 3.2
# ============================================================================
# GLOBAL PLANNER -- nav2 planner_server
# ============================================================================
planner_server:
  ros__parameters:
    # Only warns if planning is slower than this; nothing plans on a timer.
    expected_planner_frequency: 1.0
    # Both loaded; the active one is chosen per goal via PlannerSelector, same mechanism as
    # controller_plugins above for FollowPath/DWB. The behaviour tree currently defaults to
    # ThetaStar - flip default_planner in behavior_trees/navigate_to_pose_w_smoothing.xml to
    # switch back to GridBased, or override live by publishing the name to /planner_selector,
    # e.g. `ros2 topic pub -1 /planner_selector std_msgs/String "{data: GridBased}"` before
    # sending the next goal.
    planner_plugins: ["GridBased", "ThetaStar"]
    GridBased:
      # NavFn ignores heading, which suits a skid-steer that can turn on the spot. It also
      # plans on the grid, so its paths turn in 45/90 deg steps -- see smoother_server.
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      # NavFn's A* is a weak implementation; Dijkstra gives better paths at this map size.
      use_astar: false
      # UNMAPPED (2 of 3). Lets NavFn route through NO_INFORMATION. Only meaningful because
      # treat_unknown_as_obstacle is false upstream. With it false the planner refused any
      # route touching an occlusion shadow and reported NO_VALID_PATH instead of the cause.
      # The risk is real: the rover cannot tell open sand from a drop-off out there.
      allow_unknown: true
    ThetaStar:
      # Any-angle alternative to GridBased: takes line-of-sight shortcuts across the grid
      # instead of being locked to 8-connected moves, so the raw path already has fewer and
      # gentler direction changes for smoother_server to clean up - and, downstream, fewer
      # corners sharp enough to trip FollowPath's rotate_to_heading_min_angle into a full
      # stop-and-pivot. Does NOT reason about robot heading/turning radius the way
      # Hybrid-A*/SMAC would; irrelevant here since this skid-steer can pivot on the spot.
      plugin: "nav2_theta_star_planner::ThetaStarPlanner"
      how_many_corners: 8
      # Weights the search cost between the straight-line (euclidean) distance and the
      # costmap's own traversal cost - nav2's defaults, unchanged: favour a shorter path but
      # let real cost still steer it around expensive terrain, same balance GridBased's
      # Dijkstra gets for free from the costmap values it searches over directly.
      w_euc_cost: 1.0
      w_traversal_cost: 2.0
      # Same reasoning and same value as GridBased's allow_unknown above (UNMAPPED, 2 of 3):
      # this reads the same costmap under the same track_unknown_space: false regime, so it
      # needs the same policy on routing through ground the lidar has not seen yet.
      allow_unknown: true
# The planner's costmap. Doubled key because Costmap2DROS runs as its own node named
# global_costmap inside planner_server. Required, not stylistic.
global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_footprint
      robot_radius: 0.3
      # /costmap only republishes every publish_period_s (1 s); polling faster re-copies it.
      update_frequency: 1.0
      publish_frequency: 1.0
      rolling_window: false
      # width/height/resolution omitted on purpose: the static layer resizes the master
      # costmap to whatever /costmap arrives with.
      #
      # THESE FOUR LIVE HERE, NOT UNDER static_layer. StaticLayer reads them from the
      # costmap node's own namespace while every other option picks up a "static_layer."
      # prefix. Nesting them below is silently ignored -- no warning, defaults stay in
      # force. Verified: `ros2 param get /global_costmap/global_costmap trinary_costmap`
      # returned the default while static_layer.trinary_costmap read "Parameter not set".
      #
      # trinary_costmap true (the default) collapses everything under lethal_cost_threshold
      # to FREE_SPACE, throwing away the whole 0-99 inflation gradient. Measured as the
      # highest input cost the returned path crossed: 99 (grazing a wall at 0.02 m) with it
      # nested and ignored, 42 with it set here.
      trinary_costmap: false
      lethal_cost_threshold: 100
      # UNMAPPED (3 of 3). NO_INFORMATION is 255 and every collision check treats >= 253 as
      # a collision, so tracking unknown makes unmapped ground indistinguishable from a
      # wall -- RPP commands zero and the rover stalls silently until the progress checker
      # gives up. false makes unmapped ground read as free.
      track_unknown_space: false
      unknown_cost_value: 255
      # One layer. No obstacle layer (no live sensor feed here) and no inflation layer
      # (global_traversability already inflated).
      plugins: ["static_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /costmap
        # global_traversability publishes transient_local. Leaving this false is a QoS
        # mismatch: subscription created, no error logged, no message ever delivered.
        map_subscribe_transient_local: true
        subscribe_to_updates: false
lifecycle_manager_navigation:
  ros__parameters:
    autostart: true
    # Bringup order: servers that answer requests come up before the ones that make them,
    # so bt_navigator never asks a planner that is not listening yet. Must match the nodes
    # navigation.launch.py starts -- naming a missing one hangs bringup on a bond that
    # never forms.
    node_names:
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother
    # Raise this if bringup fails under load on the Orange Pi.
    bond_timeout: 4.0
# ============================================================================
# DRIVING THE ROVER -- everything below here can move it
# ============================================================================
controller_server:
  ros__parameters:
    # 20.0 is nav2's default; halved for the Orange Pi, which also runs BIEVR-LIO.
    controller_frequency: 10.0
    # /odom (the wheel diff_drive_controller) is not used here: it is the wheels' OWN belief
    # about how fast they are turning, which is exactly what sand slip corrupts - a spinning,
    # non-gripping wheel reports a confident, wrong velocity, not a degraded one. That is a
    # systematic bias (reads faster than the rover is actually moving) for as long as the slip
    # lasts, which is worse for velocity-scaled lookahead and regulated speed scaling than
    # /odometry/filtered's own documented weakness (ekf_config.yaml: its velocity is
    # extrapolated, not measured, and noisy/laggy for a few tenths of a second after a speed
    # change - a bounded, roughly zero-mean transient, not a persistent one-directional bias).
    # Matches the precedent already in this stack: mobility_watchdog compares commanded
    # velocity against /odometry/filtered specifically to detect wheel slip, i.e. it already
    # treats the EKF output, not /odom, as ground truth for "how fast is the rover really
    # going" on this terrain.
    odom_topic: /odometry/filtered
    # twist_mux is use_stamped: true. With this false the message type is wrong, twist_mux
    # never sees it, and the rover does not move with nothing in any log to say why.
    enable_stamped_cmd_vel: true
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    # Both loaded; the active one is chosen per goal via ControllerSelector. The behaviour
    # tree currently defaults to DWB -- flip default_controller in
    # behavior_trees/navigate_to_pose_w_smoothing.xml to go back to FollowPath (RPP), or
    # override live by publishing the name to /controller_selector.
    controller_plugins: ["FollowPath", "DWB"]
    progress_checker:
      # Loose on purpose: a stalled wheel, lost traction on sand, or a slow costmap update
      # are all recoverable, and nav2's 10 s default fails them too eagerly.
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 20.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # Loosened from 0.25: the rover is 0.6 m across on sand and hunts across a tighter
      # goal. Yaw is generous because final heading rarely matters and tightening it means
      # a slow spin at exactly the rate the ESCs stall at.
      xy_goal_tolerance: 0.35
      yaw_goal_tolerance: 0.3
      stateful: true
    FollowPath:
      # ACTIVE (the BT's default_controller). Follows the global path and regulates speed on
      # curvature; it does not do its own obstacle avoidance, which is right because obstacle
      # knowledge lives upstream.
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # 0.28 = 0.4 * 0.7, a deliberate 30% reduction of autonomous cruise speed.
      # safe_speed.yaml is untouched, so teleop still has the full 0.8 m/s.
      desired_linear_vel: 0.28
      # THE CORNERING TRADE. Long lookahead puts the carrot past a corner and asks for
      # gentler curvature, so it cuts corners; short lookahead tracks corners but weaves on
      # straights. Raise these if it weaves; lower them if it cuts.
      lookahead_dist: 0.6
      min_lookahead_dist: 0.4
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      # STALL. nav2's 0.05 default is exactly the tyre speed at the ESCs' minimum, i.e.
      # every goal approach commanded at the speed the wheels stop turning.
      min_approach_linear_velocity: 0.12
      approach_velocity_scaling_dist: 0.6
      use_regulated_linear_velocity_scaling: true
      # Off while the costmap still has false obstacles, or it crawls across open sand.
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      # Sets the tightest arc available, since radius = speed / angular ceiling:
      # 0.15 / 0.4 = 0.38 m, about one half-track. Cannot go much lower -- 0.15 m/s is only
      # 3x the ~0.05 m/s tyre stall speed.
      regulated_linear_scaling_min_speed: 0.15
      # Above this heading error the rover stops and pivots instead of arcing. That is the
      # only way to take a corner tighter than 0.38 m, which is most NavFn grid corners --
      # though smoother_server now removes many of them, and ThetaStar (planner_server's
      # current default) removes still more by not being grid-locked to begin with, so this
      # can sit higher than it otherwise would. Raised from 0.8: this was tuned back when
      # GridBased's forced 45/90 deg corners made a low threshold necessary; with a straighter
      # raw path, more turns can be taken as a regulated arc instead of a full stop-and-pivot.
      # Re-tune down again if it starts cutting corners too wide for the arena's clearances.
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 1.2
      # Rotate-to-heading is BANG-BANG: full rate until the error drops under the threshold,
      # no proportional slow-down. So this value alone sets the overshoot -- roughly 5 deg
      # at 0.4 rad/s, 2.5 deg at 0.25, before wheel scrub. STALL: 0.25 rad/s of body yaw is
      # 0.61 rad/s at the wheel; below ~0.15 the wheels stop mid-rotation and it hunts.
      # 0.175 = 0.25 * 0.7. NOTE THE MARGIN: the note above says do not go below about
      # 0.15 rad/s of body yaw or the wheels stop turning mid-rotation. 0.175 is only
      # 0.025 above that, so this is as slow as in-place turning can safely go. A
      # further reduction must come from somewhere else, not from this value.
      rotate_to_heading_angular_vel: 0.175
      # Must be matched by velocity_smoother's max_accel below; the lower one binds.
      max_angular_accel: 3.2
      # Cannot be true alongside use_rotate_to_heading; the controller rejects it.
      allow_reversing: false
      max_robot_pose_search_dist: 10.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      transform_tolerance: 0.2
    DWB:
      # Loaded but NOT the BT default (see controller_plugins above) - selectable live for
      # comparison via `ros2 topic pub -1 /controller_selector std_msgs/String "{data: DWB}"`
      # before a goal. Samples trajectories and scores them, so unlike RPP it avoids obstacles
      # locally rather than trusting the global path. Costs much more CPU: vx_samples *
      # vtheta_samples = 200 rollouts per cycle at 10 Hz on the Orange Pi.
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true
      min_vel_x: 0.0
      min_vel_y: 0.0
      # y is zero throughout: the rover cannot strafe. Limits match safe_speed.yaml.
      max_vel_x: 0.28
      max_vel_y: 0.0
      max_vel_theta: 0.28
      max_speed_xy: 0.28
      # STALL: both floors sit above the ESCs' 0.05 m/s and 0.14 rad/s.
      min_speed_xy: 0.06
      min_speed_theta: 0.15
      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      # vy_samples 1 because there is no lateral motion to sample.
      vx_samples: 10
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.35
      # 0.07 = 0.1 * 0.7, keeping it the same fraction of cruise speed as before.
      trans_stopped_velocity: 0.07
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      # BaseObstacle is deliberately near-zero: the costmap's own inflation already encodes
      # obstacle cost, so scoring it again double-counts. The Path/Goal critics dominate.
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
# The controller's costmap: a window travelling with the rover, filled from BOTH terrain
# costmaps -- global_traversability's map-wide /costmap as the base, with
# local_traversability's live /local_costmap_terrain maxed on top.
#
# Still not a nav2 voxel/obstacle layer off the raw MID-360: that would flag the ground
# itself, which is the whole reason the traversability nodes exist. What changed is that the
# reactive input is now terrain-analysed upstream before it reaches nav2, so this costmap is
# no longer stuck at global_traversability's 1 s republish and the rover can react to something
# that appears in front of it.
local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_footprint
      robot_radius: 0.3
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true
      # Must stay inside local_traversability's map_length_m (8 m), or the window's corners
      # reach past the edge of the live grid and read as unknown there.
      width: 6
      height: 6
      resolution: 0.1
      # Per-costmap-node, so they must be repeated here; setting them on the global costmap
      # does not reach this one. Same reasons as there -- and track_unknown_space false is
      # what makes terrain_layer's -1 cells (most of a live local window at any instant)
      # read as free rather than as an obstacle, which is what lets use_maximum be safe.
      trinary_costmap: false
      lethal_cost_threshold: 100
      unknown_cost_value: 255
      track_unknown_space: false
      # THIS IS WHAT MAKES TWO LAYERS COMBINE INSTEAD OF THE SECOND ERASING THE FIRST, and
      # IT BELONGS HERE, NOT UNDER terrain_layer. Same trap as the four above: StaticLayer
      # reads use_maximum from the costmap node's own namespace while every other option it
      # takes picks up a "<layer_name>." prefix. Nested under the layer it is silently
      # ignored -- no warning, default stays in force. Verified the same way as
      # trinary_costmap was: `ros2 param get /local_costmap/local_costmap use_maximum`
      # returned a value while terrain_layer.use_maximum read "Parameter not set".
      #
      # false (the default) means each layer OVERWRITES the master. With terrain_layer
      # second that throws away everything global_traversability knows about the cells the
      # live scan happens not to cover -- which at any instant is most of the window.
      #
      # true makes each layer take the max instead, so the two combine: a live grid can only
      # ever ADD an obstacle, never clear one the global map found. That is the only safe
      # direction, because "I cannot see it right now" and "it is not there" are the same
      # value in an OccupancyGrid. It applies to BOTH layers, which is correct: the master
      # is reset to free each cycle (track_unknown_space false), so static_layer maxing onto
      # a zeroed master reproduces the old overwrite behaviour exactly.
      use_maximum: true
      # ORDER IS THE SEMANTICS. static_layer lays down the map-wide terrain costmap, then
      # terrain_layer maxes the live one over it.
      plugins: ["static_layer", "terrain_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /costmap
        map_subscribe_transient_local: true
        subscribe_to_updates: false
      # local_traversability's live grid. map_subscribe_transient_local FALSE here is the
      # opposite of static_layer above, and it is a QoS match rather than a preference:
      # local_traversability publishes this topic VOLATILE on purpose (a grid is only
      # meaningful next to the robot pose it was built around, so a latched stale one is
      # worse than none). Set it true and the subscription is created, no error is logged,
      # and no message is ever delivered.
      terrain_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /local_costmap_terrain
        map_subscribe_transient_local: false
        subscribe_to_updates: false
# Smooths NavFn's grid path before the controller sees it. Called from the behaviour tree
# in behavior_trees/navigate_to_pose_w_smoothing.xml, NOT automatically -- nav2's stock
# tree never calls SmoothPath, so this server would sit idle without that file.
#
# This is the fix for both cornering failures at once: NavFn turns in 45/90 deg steps on a
# 0.1 m grid, the tightest arc the rover can drive is 0.38 m, so every grid corner had to
# be either cut or pivoted through and no controller tuning changes that.
#
# NavigateThroughPoses -- and therefore waypoint following -- still uses nav2's stock tree
# and is NOT smoothed.
smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      # Trades staying near the planned path (w_data) against straightening it (w_smooth).
      # More smoothing pulls away from the clearance the planner left, which is why the
      # behaviour tree runs it with check_for_collisions true.
      w_data: 0.2
      w_smooth: 0.3
      tolerance: 1.0e-10
      # The real budget is max_smoothing_duration (0.2 s) in the behaviour tree.
      max_its: 1000
      do_refinement: true
      refinement_num: 2
    # Collision checking reads the PLANNER's costmap, so it rejects a smoothed path against
    # the same terrain analysis the path was planned on.
    costmap_topic: global_costmap/costmap_raw
    footprint_topic: global_costmap/published_footprint
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    # The three the default tree calls. AssistedTeleop has no place on a rover whose teleop
    # already outranks nav2 in twist_mux.
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    enable_stamped_cmd_vel: true
    # STALL: min_rotational_vel is the floor for a recovery spin, and 0.4 clears it.
    max_rotational_vel: 0.4
    min_rotational_vel: 0.4
    rotational_acc_lim: 1.0
bt_navigator:
  ros__parameters:
    global_frame: odom
    robot_base_frame: base_footprint
    # Same reasoning as controller_server's odom_topic above: /odom (wheel encoders) reads a
    # systematic bias under sand slip, not just noise, so any BT node that consults this
    # (e.g. a stuck/velocity check) should see the same ground-truth velocity
    # mobility_watchdog already trusts, not the wheels' own confident-but-wrong one.
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
      # default_nav_to_pose_bt_xml is set by navigation.launch.py: it is an absolute path
      # into this package's share directory, which only the launch file can resolve.
waypoint_follower:
  ros__parameters:
    loop_rate: 20
    # false: an unreachable waypoint is skipped rather than abandoning the run.
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      # MILLISECONDS: this is 0.2 s, not 200 s.
      waypoint_pause_duration: 200
# Last thing between nav2 and the wheels, and what actually publishes onto twist_mux's
# navigation input (via the cmd_vel_smoothed remap in navigation.launch.py).
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    enable_stamped_cmd_vel: true
    # [x, y, theta]; y is zero because the rover cannot strafe. Theta must match
    # safe_speed.yaml or this becomes a second, hidden ceiling -- at 0.2 it silently fixed
    # the minimum turning radius at 0.4/0.2 = 2.0 m and no controller tuning could help.
    # [0.28, 0.0, 0.28] = 30% off. This is the binding ceiling for BOTH controllers, so
    # it is the one value to change if the reduction ever needs undoing in a hurry.
    max_velocity: [0.28, 0.0, 0.28]
    min_velocity: [-0.28, 0.0, -0.28]
    # Theta matches FollowPath's max_angular_accel; whichever is lower binds.
    max_accel: [1.0, 0.0, 3.2]
    max_decel: [-1.0, 0.0, -3.2]
    odom_topic: "/odom"
    odom_duration: 0.1
    # Zero on purpose. A deadband here risks a ramp-up deadlock: with OPEN_LOOP feedback the
    # smoother ramps from its own last output, so a first step below the deadband is zeroed
    # and it can never build speed.
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
