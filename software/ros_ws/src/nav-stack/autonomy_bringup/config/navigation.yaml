# Everything navigation.launch.py brings up: the terrain costmap, the global planner, and
# the nav2 stack that drives to a goal.
#
#   /Laser_map -> global_traversability -> /costmap -> planner_server   -> /plan
#                                                   -> smoother_server
#                                                   -> controller_server -> /cmd_vel
#                                                   -> velocity_smoother -> /cmd_vel_nav_stamped
#                                                   -> twist_mux -> diff drive -> VESCs
#
# THREE THINGS THAT ARE NOT OBVIOUS AND WILL COST YOU AN AFTERNOON:
#   * There is no map frame. BIEVR-LIO's world frame is odom; nothing publishes map->odom.
#     Every global_frame here is odom.
#   * twist_mux gives navigation priority 10 vs joystick 100 / web_ui 80. If either of those
#     publishes continuously, nav2 never reaches the wheels.
#   * The ESCs stall below ~0.34 rad/s at the wheel = 0.05 m/s at the tyre, 0.14 rad/s of
#     body yaw. Several nav2 defaults sit under that; the ones that matter are marked STALL.
# ============================================================================
# TERRAIN COSTMAP -- global_traversability
# ============================================================================
global_traversability:
  ros__parameters:
    pointcloud_topic: "/Laser_map"
    resolution_m: 0.1
    map_margin_m: 1.0
    update_period_s: 5.0
    # Local plane fit, for steepness/roughness/ridge.
    neighbourhood_radius_m: 0.3
    min_plane_fit_points: 4
    # How far above a cell's ground a point must be to count as overhead rather than
    # ground noise. Raised from 0.05 because LIO z-wander writes the same ground twice
    # 5-10 cm apart, and the clearance test read the upper copy as a low ceiling.
    # Trades against detecting low obstacles: boulder cells report clearance around 0.06.
    ground_margin_m: 0.15
    # Fewer points than this and the cell is unknown, not ground. 3 was too high: it made
    # sparsely-sampled rocks invisible. Measured on 7 sim boulders, 2 and 1 perform the
    # same with no false positives, so 2 keeps a little protection against a stray return.
    min_points_per_cell: 2
    # Open ground here already reaches 13.5 deg, so tightening this flags flat regolith.
    max_slope_deg: 30.0
    # Boulders read 0.042-0.078, open ground 0.003-0.015. Tightening is the worst thing you
    # can do: false positives go 1 -> 22 -> 74 -> 125 at 0.08 / 0.04 / 0.03 / 0.025, with
    # detection unchanged at 7/7 throughout.
    max_roughness_m: 0.08
    # THE VERTICAL TEST: height above a RANSAC ground plane, not max(z)-min(z) in the cell.
    # The plane follows a berm instead of flagging it.
    #
    # Do not expect much from these dials. On rosbag2_1970_01_01-10_31_15 the whole test
    # decides ~60 of 4045 obstacle cells; inlier_m swept 0.08-0.20 and max_height 0.10-0.25
    # were worth 24 cells between them. min_clearance_m below decides far more.
    ransac_inlier_m: 0.20
    max_height_above_ground_m: 0.20
    # Patch the plane is fitted over, plus a one-patch halo so neighbours overlap. Must be
    # well clear of the 30-40 cm boulders or one becomes its own ground and vanishes.
    ransac_patch_m: 1.0
    ransac_iterations: 40
    # Erase obstacle blobs smaller than this (8-connected). A 30-40 cm boulder covers 9-16
    # cells at 0.1 m, so 4 cannot erase one. Removes 362 of 4034 cells (9%), all marginal.
    # A filter on a symptom: the real fix was huber_delta 0.1 -> 0.01 in bievr_mid360.yaml,
    # which took flagged cells 2361 -> 816 on identical LiDAR.
    min_obstacle_cells: 4
    # THE TEST THAT FLAGS YOUR FLAT GROUND. Ablation on the same bag, one test off at a
    # time: clearance -1079, steepness -231, vertical -57, roughness -44. And every
    # offending cell sits between ground_margin_m and 0.10 m of clearance -- not overhead
    # structure, just the map's second copy of the floor. Hence ground_margin_m above.
    min_clearance_m: 0.6
    # false: unmapped cells publish as -1, not cost 100. One of three settings that decide
    # whether the rover may cross ground the lidar has never seen; the others are
    # allow_unknown and the costmaps' track_unknown_space. Search UNMAPPED for all three.
    treat_unknown_as_obstacle: false
    # Inflation, same semantics as nav2's InflationLayer. nav2 does NOT inflate on top of
    # this -- neither costmap loads an inflation layer.
    robot_radius_m: 0.5
    inflation_radius_m: 0.8
    cost_scaling_factor: 3.2
# ============================================================================
# GLOBAL PLANNER -- nav2 planner_server
# ============================================================================
planner_server:
  ros__parameters:
    # Only warns if planning is slower than this; nothing plans on a timer.
    expected_planner_frequency: 1.0
    # Both loaded; the active one is chosen per goal via PlannerSelector, same mechanism as
    # controller_plugins below uses for FollowPath/RPP/DWB. The behaviour tree currently defaults to
    # ThetaStar - flip default_planner in behavior_trees/navigate_to_pose_w_smoothing.xml to
    # switch back to GridBased, or override live by publishing the name to /planner_selector,
    # e.g. `ros2 topic pub -1 /planner_selector std_msgs/String "{data: GridBased}"` before
    # sending the next goal.
    planner_plugins: ["GridBased", "ThetaStar"]
    GridBased:
      # NavFn ignores heading, which suits a skid-steer that can turn on the spot. It also
      # plans on the grid, so its paths turn in 45/90 deg steps -- see smoother_server.
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      # NavFn's A* is a weak implementation; Dijkstra gives better paths at this map size.
      use_astar: false
      # UNMAPPED (2 of 3). Lets NavFn route through NO_INFORMATION. Only meaningful because
      # treat_unknown_as_obstacle is false upstream. With it false the planner refused any
      # route touching an occlusion shadow and reported NO_VALID_PATH instead of the cause.
      # The risk is real: the rover cannot tell open sand from a drop-off out there.
      allow_unknown: true
    ThetaStar:
      # Any-angle alternative to GridBased: takes line-of-sight shortcuts across the grid
      # instead of being locked to 8-connected moves, so the raw path already has fewer and
      # gentler direction changes for smoother_server to clean up - and, downstream, fewer
      # corners sharp enough to trip a stop-and-pivot out of the controller (RPP's
      # rotate_to_heading_min_angle, MPPI's PathAngleCritic.max_angle_to_furthest). Does NOT reason about robot heading/turning radius the way
      # Hybrid-A*/SMAC would; irrelevant here since this skid-steer can pivot on the spot.
      plugin: "nav2_theta_star_planner::ThetaStarPlanner"
      how_many_corners: 8
      # Weights the search cost between the straight-line (euclidean) distance and the
      # costmap's own traversal cost - nav2's defaults, unchanged: favour a shorter path but
      # let real cost still steer it around expensive terrain, same balance GridBased's
      # Dijkstra gets for free from the costmap values it searches over directly.
      w_euc_cost: 1.0
      w_traversal_cost: 2.0
      # Same reasoning and same value as GridBased's allow_unknown above (UNMAPPED, 2 of 3):
      # this reads the same costmap under the same track_unknown_space: false regime, so it
      # needs the same policy on routing through ground the lidar has not seen yet.
      allow_unknown: true
# The planner's costmap. Doubled key because Costmap2DROS runs as its own node named
# global_costmap inside planner_server. Required, not stylistic.
global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_footprint
      robot_radius: 0.3
      # /costmap only republishes every update_period_s (5 s); polling faster re-copies it.
      update_frequency: 1.0
      publish_frequency: 1.0
      rolling_window: false
      # width/height/resolution omitted on purpose: the static layer resizes the master
      # costmap to whatever /costmap arrives with.
      #
      # THESE FOUR LIVE HERE, NOT UNDER static_layer. StaticLayer reads them from the
      # costmap node's own namespace while every other option picks up a "static_layer."
      # prefix. Nesting them below is silently ignored -- no warning, defaults stay in
      # force. Verified: `ros2 param get /global_costmap/global_costmap trinary_costmap`
      # returned the default while static_layer.trinary_costmap read "Parameter not set".
      #
      # trinary_costmap true (the default) collapses everything under lethal_cost_threshold
      # to FREE_SPACE, throwing away the whole 0-99 inflation gradient. Measured as the
      # highest input cost the returned path crossed: 99 (grazing a wall at 0.02 m) with it
      # nested and ignored, 42 with it set here.
      trinary_costmap: false
      lethal_cost_threshold: 100
      # UNMAPPED (3 of 3). NO_INFORMATION is 255 and every collision check treats >= 253 as
      # a collision, so tracking unknown makes unmapped ground indistinguishable from a
      # wall -- RPP commands zero and the rover stalls silently until the progress checker
      # gives up. false makes unmapped ground read as free.
      track_unknown_space: false
      unknown_cost_value: 255
      # One layer. No obstacle layer (no live sensor feed here) and no inflation layer
      # (global_traversability already inflated).
      plugins: ["static_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /costmap
        # global_traversability publishes transient_local. Leaving this false is a QoS
        # mismatch: subscription created, no error logged, no message ever delivered.
        map_subscribe_transient_local: true
        subscribe_to_updates: false
lifecycle_manager_navigation:
  ros__parameters:
    autostart: true
    # Bringup order: servers that answer requests come up before the ones that make them,
    # so bt_navigator never asks a planner that is not listening yet. Must match the nodes
    # navigation.launch.py starts -- naming a missing one hangs bringup on a bond that
    # never forms.
    node_names:
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother
    # Raise this if bringup fails under load on the Orange Pi.
    bond_timeout: 4.0
# ============================================================================
# DRIVING THE ROVER -- everything below here can move it
# ============================================================================
controller_server:
  ros__parameters:
    # 20.0 is nav2's default; halved for the Orange Pi, which also runs BIEVR-LIO.
    controller_frequency: 10.0
    # HOW LONG computeControl() WILL WAIT FOR local_costmap TO GO current BEFORE KILLING
    # THE GOAL. nav2's default is 0.3 s, which cannot work against this terrain pipeline.
    # Every time the LiDAR map grows, local_costmap's StaticLayer resizes and drops out of
    # isCurrent(); it can only come back when the next /costmap arrives, and
    # global_traversability publishes on update_period_s: 5.0. So there is a window of up
    # to 5 s after each resize in which the 0.3 s wait CANNOT succeed, and any goal landing
    # in it dies with "Costmap timed out waiting for update" before a single control cycle
    # runs -- for ANY controller, since this wait sits in ControllerServer above the plugin.
    # Looks random from outside because it depends on goal timing vs resize timing.
    # 6.0 covers the 5 s publish period with margin. It costs nothing on a normal goal:
    # the costmap is already current, so the wait returns immediately. Keep this ABOVE
    # global_traversability's update_period_s if that is ever changed.
    # NOTE: read in on_configure, so a live `ros2 param set` does nothing -- relaunch.
    costmap_update_timeout: 6.0
    # /odom (the wheel diff_drive_controller) is not used here: it is the wheels' OWN belief
    # about how fast they are turning, which is exactly what sand slip corrupts - a spinning,
    # non-gripping wheel reports a confident, wrong velocity, not a degraded one. That is a
    # systematic bias (reads faster than the rover is actually moving) for as long as the slip
    # lasts, which is worse for velocity-scaled lookahead and regulated speed scaling than
    # /odometry/filtered's own documented weakness (ekf_config.yaml: its velocity is
    # extrapolated, not measured, and noisy/laggy for a few tenths of a second after a speed
    # change - a bounded, roughly zero-mean transient, not a persistent one-directional bias).
    # Matches the precedent already in this stack: mobility_watchdog compares commanded
    # velocity against /odometry/filtered specifically to detect wheel slip, i.e. it already
    # treats the EKF output, not /odom, as ground truth for "how fast is the rover really
    # going" on this terrain.
    odom_topic: /odometry/filtered
    # twist_mux is use_stamped: true. With this false the message type is wrong, twist_mux
    # never sees it, and the rover does not move with nothing in any log to say why.
    enable_stamped_cmd_vel: true
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    # All three loaded; the active one is chosen per goal via ControllerSelector. MPPI is
    # registered under the name FollowPath, which is what makes it the default -- see the
    # note on that block. RPP (the previous default) and DWB stay loaded so a bad MPPI run
    # can be compared against them without a rebuild: publish the name to
    # /controller_selector before the next goal, e.g.
    # `ros2 topic pub -1 /controller_selector std_msgs/String "{data: RPP}"`.
    # That only covers navigate_to_pose_w_smoothing.xml; navigate_through_poses uses
    # nav2's stock tree, which hardcodes FollowPath and so always gets MPPI.
    controller_plugins: ["FollowPath", "RPP", "DWB"]
    progress_checker:
      # Loose on purpose: a stalled wheel, lost traction on sand, or a slow costmap update
      # are all recoverable, and nav2's 10 s default fails them too eagerly.
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 20.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # Loosened from 0.25: the rover is 0.6 m across on sand and hunts across a tighter
      # goal. Yaw is generous because final heading rarely matters and tightening it means
      # a slow spin at exactly the rate the ESCs stall at.
      xy_goal_tolerance: 0.35
      yaw_goal_tolerance: 0.3
      stateful: true
    FollowPath:
      # ACTIVE. Named FollowPath because that is the controller_id nav2's own stock trees
      # hardcode -- navigate_through_poses (waypoint following) uses the stock tree, so a
      # plugin registered under any other name would never run there. Renaming the RPP
      # entry below and giving MPPI this name is how MPPI becomes the default EVERYWHERE,
      # not just in navigate_to_pose_w_smoothing.xml's ControllerSelector.
      #
      # WHAT CHANGES vs RPP: MPPI samples batch_size whole velocity sequences per cycle,
      # scores each against the critics below, and commands the softmax-weighted average.
      # So unlike RPP it does reason about the local costmap, via CostCritic -- the one
      # critic here that can fight the upstream "obstacle knowledge lives upstream"
      # design, and the one to suspect first if MPPI refuses to move. Read its note.
      plugin: "nav2_mppi_controller::MPPIController"
      # HORIZON AND CPU. model_dt must equal 1/controller_frequency (10 Hz -> 0.1).
      # 30 steps x 0.1 s = 3.0 s, which at 0.28 m/s is 0.84 m of lookahead -- deliberately
      # close to RPP's max_lookahead_dist of 0.9 so the two are comparable on the same run.
      model_dt: 0.1
      # THE HORIZON MUST CONTAIN A WHOLE TURN. This is the single value that decides
      # whether MPPI can turn at all. wz_max is 0.28 rad/s, so a 90 deg turn takes
      # 1.57/0.28 = 5.6 s; 56 x 0.1 = 5.6 s covers exactly that. At the old 30 steps
      # (3.0 s) the horizon held only 0.84 rad = 48 deg, so for any larger heading error
      # EVERY sampled trajectory ended still misaligned, left and right scored the same,
      # and the optimiser averaged symmetric noise to nothing -- measured as wz flipping
      # between +0.280 and -0.256 with a mean of -0.017, netting 48 deg of a 90 deg turn
      # in 30 s. If you ever raise velocity_smoother's theta ceiling, this can come down
      # in proportion; if you lower it, this must go up or the oscillation returns.
      time_steps: 56
      # nav2's default is 2000. That is 2000 x 30 = 60k trajectory points per cycle at
      # 10 Hz on an Orange Pi that is also running BIEVR-LIO; 600 keeps it near 3x DWB's
      # 200 rollouts, which this stack already calls expensive. THIS IS THE FIRST DIAL:
      # raise it if the commanded velocity looks jittery or it clips corners, lower it if
      # controller_server starts logging that it missed its control loop deadline.
      # Lowered 600 -> 400 when time_steps went 30 -> 56, so total work per cycle rose
      # only ~24% (400x56 vs 600x30) rather than doubling. Measured holding 10.0 Hz.
      batch_size: 400
      iteration_count: 1
      # KINEMATICS. Every one of these is bounded by velocity_smoother's max_velocity
      # [0.28, 0.0, 0.28] and max_accel [1.0, 0.0, 3.2] at the bottom of this file --
      # the lower of the two binds, so exceeding them here just means MPPI plans motion
      # the smoother then refuses to pass on.
      vx_max: 0.28
      # 0.0, not negative: no reversing, same policy as RPP's allow_reversing below. There
      # is nothing facing backwards and the costmap is a 5 s-stale copy of the global
      # terrain map, so a reverse manoeuvre would be driven entirely on stale data.
      vx_min: 0.0
      # y is zero throughout this file; the rover cannot strafe. Unread under DiffDrive.
      vy_max: 0.0
      wz_max: 0.28
      ax_max: 1.0
      ax_min: -1.0
      ay_max: 0.0
      az_max: 3.2
      # SAMPLING WIDTH, and the setting most likely to need changing. These are the std
      # devs of the noise added around the current control sequence, so they should be a
      # decent fraction of the range they explore. nav2's defaults (0.2 / 0.4) assume a
      # ~0.5 m/s, ~1.9 rad/s robot; against our 0.28 ceilings they would spend most samples
      # clipped at the limits and waste the batch. Roughly half the usable band each.
      vx_std: 0.1
      vy_std: 0.0
      wz_std: 0.15
      # Softmax sharpness (lower = greedier) and running-cost discount. nav2 defaults.
      temperature: 0.3
      gamma: 0.015
      # How far ahead of the robot the global path is kept. MUST EXCEED THE HORIZON
      # DISTANCE or the path-following critics run out of path to score against and go
      # quiet. At vx_max 0.28 over 5.6 s that distance is 1.57 m, so this is 2.0 with a
      # margin. Raise it with time_steps.
      prune_distance: 2.0
      transform_tolerance: 0.2
      # Skid-steer: pivots on the spot, no turning radius, no path inversions to detect.
      motion_model: "DiffDrive"
      enforce_path_inversion: false
      # How many times the optimizer retries a cycle whose softmax came out degenerate
      # (every sample in collision) before giving up and reporting a controller failure to
      # the BT. 1 is nav2's default; the BT's RecoveryNode handles it from there.
      retry_attempt_limit: 1
      # OFF for CPU. Turn this on to get the sampled trajectories on /trajectories and the
      # chosen one on /local_plan in RViz -- invaluable for tuning the critics, far too
      # expensive to leave on for a real run. Nothing else in this stack visualises WHY
      # MPPI chose what it chose, so expect to need it at least once.
      visualize: true
      # Noise is regenerated only when the optimizer needs it; true costs CPU for little.
      regenerate_noises: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic", "VelocityDeadbandCritic"]
      # Penalises samples that violate the vx/wz limits above. Keeps the averaged command
      # inside the envelope instead of relying on clipping, which biases the mean.
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      # RE-ENABLED, but treat its tuning as UNVERIFIED -- see the caveat at the end.
      #
      # WHAT IT DOES. CostCritic hard-fails any trajectory whose pose lands on a cell at
      # LETHAL_OBSTACLE (254), and that verdict is independent of cost_weight: fail_flag
      # comes from all_trajectories_collide, computed before the weight is applied. If
      # every sample collides the optimizer retries retry_attempt_limit times and then
      # throws NoValidControl("Optimizer fail to compute path"), aborting follow_path.
      # Cost and Obstacles are the only critics in this list that can do that, so if you
      # ever see that error, this is the critic to suspect and enabled: false is the only
      # setting that silences it -- turning the weight down does nothing.
      #
      # consider_footprint false: the rover is circular (robot_radius 0.3) and the local
      # costmap carries no inflation layer, so footprint checking buys nothing and costs a
      # lot. THIS MAKES NAV2 LOG AN ERROR AT STARTUP -- "Inflation layer either not found
      # or inflation is not set sufficiently for optimized non-circular collision
      # checking", plus a matching WARN. Both are benign and expected: they only apply to
      # SE2/non-circular checking, which is exactly what consider_footprint false turns
      # off. Do not add an inflation layer to chase them; global_traversability already
      # inflated the map upstream and a second inflation would double-count.
      #
      # CAVEAT, 2026-09-20. This critic was briefly disabled after it appeared to fail
      # every trajectory in sim -- the local costmap showed the rover standing on a 254
      # cell, with lethal cells directly adjacent to free ones and no inflation halo. That
      # session turned out to be running navigation with use_sim_time:=false against a
      # Gazebo sim publishing /clock, so nav2's clock was ~1.79e9 s ahead of every TF and
      # sensor stamp and the local costmap was never updating at all. The costmap content
      # that evidence rests on is therefore untrustworthy. Re-verify against a correctly
      # clocked run before concluding anything about these weights.
      #
      # WEIGHT LOWERED 3.81 -> 1.0 BECAUSE IT AVOIDED TOO EARLY. Two effects compound.
      # First, global_traversability already inflates every obstacle by robot_radius_m 0.5
      # + inflation_radius_m 0.8, so cost starts climbing ~1.3 m before the obstacle, and
      # the PLANNER already routed around that same inflated map -- re-scoring it here
      # double-counts a decision that was already made upstream. Second, this critic sums
      # over every sampled trajectory point, so raising time_steps 30 -> 56 doubled its
      # contribution for free while the path critics stayed put. At 3.81 a trajectory
      # crossing mid-gradient cost ~63, against PathAlignCritic's whole budget of ~14, and
      # the rover swerved around obstacles roughly 2.4 m out. 1.0 puts it back in the same
      # league as the path critics, so it trims a path that is genuinely tight instead of
      # rewriting one that is merely near something. critical_cost is untouched: the
      # close-in, inscribed-obstacle case should still dominate everything.
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.0
        critical_cost: 300.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        # Only bites inside this distance; must stay above goal_checker's
        # xy_goal_tolerance (0.35) or it never engages before the goal is declared met.
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      # Keeps trajectories on the planned path. offset_from_furthest is in PATH POINTS,
      # and ThetaStar interpolates to costmap resolution, so 8 points is ~0.8 m -- scaled
      # down from nav2's default 20 (2.0 m) because that is more than our whole horizon.
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 8
        use_path_orientations: false
      # Drives progress ALONG the path rather than just near it -- the critic that stops
      # it settling next to the path and stalling.
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      # THE CRITIC THAT ACTUALLY TURNS THE ROVER, and the second half of the oscillation
      # fix. It scores heading error against the path -- but note the gate is inverted
      # from what the name suggests: the critic returns early and contributes NOTHING when
      # the heading error is BELOW max_angle_to_furthest. At 1.2 rad (69 deg), copied
      # across from RPP's rotate_to_heading_min_angle, it was silent for most of every
      # turn, leaving only the position-based critics to infer a direction. 0.6 rad
      # (34 deg) keeps it active through the bulk of a turn. Weight raised 2.0 -> 8.0 so
      # it can compete with PathAlignCritic's 14.0; at 2.0 it was audible but not decisive.
      # mode 0 = forward preference, which pairs with vx_min 0.0 above.
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 0.6
        mode: 0
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      # STALL, and the reason MPPI needs a critic RPP did not. RPP has explicit floors
      # (min_approach_linear_velocity, rotate_to_heading_angular_vel); MPPI commands a
      # softmax-weighted average, which lands anywhere -- including under the ESCs'
      # 0.05 m/s, where the wheels stop turning and the rover stalls silently.
      #
      # READ THIS BEFORE CHANGING deadband_velocities. The critic scores
      # max(deadband - |v|, 0) per axis per timestep, so it penalises a command of ZERO
      # HARDEST of all -- it is a gradient pushing |v| up and out of the deadband, not a
      # notch filter around it. Two consequences:
      #
      #   * THETA MUST STAY 0.0 (0.0 disables an axis: max(0 - |v|, 0) is always 0). A
      #     0.15 there would penalise wz = 0, i.e. driving in a straight line, harder than
      #     it penalises turning -- the exact opposite of what is wanted, and it would bias
      #     MPPI into permanent weaving. The theta stall floor does not need guarding
      #     anyway: 0.14 rad/s of body yaw only stalls the wheels when vx is also ~0 (a
      #     pure pivot). Under way, both wheels are already turning well above stall and a
      #     small wz is just a differential between them.
      #   * x at 0.06 therefore also penalises vx = 0, which biases MPPI toward arcing
      #     rather than pivoting in place. That is mostly the direction this stack already
      #     chose (see rotate_to_heading_min_angle raised to 1.2 under RPP), and it is why
      #     the weight is 10 and not nav2's default 35: at 35 the pivot penalty (0.06 x 30
      #     steps x 35 = 63) rivals PathAlignCritic's whole budget, and MPPI would rather
      #     drive off the path than turn on the spot. 10 keeps it a tie-breaker.
      #
      # If it will not pivot for a sharp initial heading error, lower this weight before
      # touching anything else. 0.06 matches DWB's min_speed_xy below.
      #
      # THE WEIGHT MUST BE RESCALED WITH time_steps. The penalty is summed over every
      # timestep, so going 30 -> 56 steps nearly doubled it for free: at the old 10.0 a
      # pivot (vx = 0) cost 0.06 x 56 x 10 = 33.6, enough to outweigh turning properly.
      # 4.0 restores roughly the original magnitude (0.06 x 56 x 4 = 13.4).
      VelocityDeadbandCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        deadband_velocities: [0.06, 0.0, 0.0]
    RPP:
      # NO LONGER THE DEFAULT -- MPPI took the FollowPath name above. Kept loaded and
      # selectable via /controller_selector as the known-good fallback, and as the
      # reference every value in the MPPI block was scaled against. Follows the global
      # path and regulates speed on curvature; it does not do its own obstacle avoidance,
      # which is right because obstacle knowledge lives upstream. MPPI, with CostCritic
      # disabled, now takes the same position for the same reason.
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # 0.28 = 0.4 * 0.7, a deliberate 30% reduction of autonomous cruise speed.
      # safe_speed.yaml is untouched, so teleop still has the full 0.8 m/s.
      desired_linear_vel: 0.28
      # THE CORNERING TRADE. Long lookahead puts the carrot past a corner and asks for
      # gentler curvature, so it cuts corners; short lookahead tracks corners but weaves on
      # straights. Raise these if it weaves; lower them if it cuts.
      lookahead_dist: 0.6
      min_lookahead_dist: 0.4
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      # STALL. nav2's 0.05 default is exactly the tyre speed at the ESCs' minimum, i.e.
      # every goal approach commanded at the speed the wheels stop turning.
      min_approach_linear_velocity: 0.12
      approach_velocity_scaling_dist: 0.6
      use_regulated_linear_velocity_scaling: true
      # Off while the costmap still has false obstacles, or it crawls across open sand.
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      # Sets the tightest arc available, since radius = speed / angular ceiling:
      # 0.15 / 0.4 = 0.38 m, about one half-track. Cannot go much lower -- 0.15 m/s is only
      # 3x the ~0.05 m/s tyre stall speed.
      regulated_linear_scaling_min_speed: 0.15
      # Above this heading error the rover stops and pivots instead of arcing. That is the
      # only way to take a corner tighter than 0.38 m, which is most NavFn grid corners --
      # though smoother_server now removes many of them, and ThetaStar (planner_server's
      # current default) removes still more by not being grid-locked to begin with, so this
      # can sit higher than it otherwise would. Raised from 0.8: this was tuned back when
      # GridBased's forced 45/90 deg corners made a low threshold necessary; with a straighter
      # raw path, more turns can be taken as a regulated arc instead of a full stop-and-pivot.
      # Re-tune down again if it starts cutting corners too wide for the arena's clearances.
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 1.2
      # Rotate-to-heading is BANG-BANG: full rate until the error drops under the threshold,
      # no proportional slow-down. So this value alone sets the overshoot -- roughly 5 deg
      # at 0.4 rad/s, 2.5 deg at 0.25, before wheel scrub. STALL: 0.25 rad/s of body yaw is
      # 0.61 rad/s at the wheel; below ~0.15 the wheels stop mid-rotation and it hunts.
      # 0.175 = 0.25 * 0.7. NOTE THE MARGIN: the note above says do not go below about
      # 0.15 rad/s of body yaw or the wheels stop turning mid-rotation. 0.175 is only
      # 0.025 above that, so this is as slow as in-place turning can safely go. A
      # further reduction must come from somewhere else, not from this value.
      rotate_to_heading_angular_vel: 0.175
      # Must be matched by velocity_smoother's max_accel below; the lower one binds.
      max_angular_accel: 3.2
      # Cannot be true alongside use_rotate_to_heading; the controller rejects it.
      allow_reversing: false
      max_robot_pose_search_dist: 10.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      transform_tolerance: 0.2
    DWB:
      # Loaded but NOT the default (see controller_plugins above) - selectable live for
      # comparison via `ros2 topic pub -1 /controller_selector std_msgs/String "{data: DWB}"`
      # before a goal. Samples trajectories and scores them, so unlike RPP it avoids obstacles
      # locally rather than trusting the global path. Costs much more CPU: vx_samples *
      # vtheta_samples = 200 rollouts per cycle at 10 Hz on the Orange Pi.
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true
      min_vel_x: 0.0
      min_vel_y: 0.0
      # y is zero throughout: the rover cannot strafe. Limits match safe_speed.yaml.
      max_vel_x: 0.28
      max_vel_y: 0.0
      max_vel_theta: 0.28
      max_speed_xy: 0.28
      # STALL: both floors sit above the ESCs' 0.05 m/s and 0.14 rad/s.
      min_speed_xy: 0.06
      min_speed_theta: 0.15
      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      # vy_samples 1 because there is no lateral motion to sample.
      vx_samples: 10
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.35
      # 0.07 = 0.1 * 0.7, keeping it the same fraction of cruise speed as before.
      trans_stopped_velocity: 0.07
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      # BaseObstacle is deliberately near-zero: the costmap's own inflation already encodes
      # obstacle cost, so scoring it again double-counts. The Path/Goal critics dominate.
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
# The controller's costmap: a window travelling with the rover, filled from the SAME
# /costmap as the global one.
#
# Not a live sensor layer on purpose -- a voxel layer off the raw MID-360 would flag the
# ground itself. The cost is latency: this is only as fresh as global_traversability's
# 5 s update, so the rover cannot react to anything that appears in front of it.
#
# MPPI WOULD read this costmap, via CostCritic -- and that is exactly why CostCritic is
# disabled. The false positives here flag the cell the rover is standing on, which MPPI
# reads as "every trajectory I can sample starts in a collision". See the CostCritic note
# above. Cleaning this up is the prerequisite for giving MPPI real local avoidance.
local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_footprint
      robot_radius: 0.3
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.1
      # Per-costmap-node, so they must be repeated here; setting them on the global costmap
      # does not reach this one. Same reasons as there.
      trinary_costmap: false
      lethal_cost_threshold: 100
      unknown_cost_value: 255
      track_unknown_space: false
      plugins: ["static_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /costmap
        map_subscribe_transient_local: true
        subscribe_to_updates: false
# Smooths NavFn's grid path before the controller sees it. Called from the behaviour tree
# in behavior_trees/navigate_to_pose_w_smoothing.xml, NOT automatically -- nav2's stock
# tree never calls SmoothPath, so this server would sit idle without that file.
#
# This is the fix for both cornering failures at once: NavFn turns in 45/90 deg steps on a
# 0.1 m grid, the tightest arc the rover can drive is 0.38 m, so every grid corner had to
# be either cut or pivoted through and no controller tuning changes that.
#
# NavigateThroughPoses -- and therefore waypoint following -- still uses nav2's stock tree
# and is NOT smoothed.
smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      # Trades staying near the planned path (w_data) against straightening it (w_smooth).
      # More smoothing pulls away from the clearance the planner left, which is why the
      # behaviour tree runs it with check_for_collisions true.
      w_data: 0.2
      w_smooth: 0.3
      tolerance: 1.0e-10
      # The real budget is max_smoothing_duration (0.2 s) in the behaviour tree.
      max_its: 1000
      do_refinement: true
      refinement_num: 2
    # Collision checking reads the PLANNER's costmap, so it rejects a smoothed path against
    # the same terrain analysis the path was planned on.
    costmap_topic: global_costmap/costmap_raw
    footprint_topic: global_costmap/published_footprint
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    # The three the default tree calls. AssistedTeleop has no place on a rover whose teleop
    # already outranks nav2 in twist_mux.
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    enable_stamped_cmd_vel: true
    # STALL: min_rotational_vel is the floor for a recovery spin, and 0.4 clears it.
    max_rotational_vel: 0.4
    min_rotational_vel: 0.4
    rotational_acc_lim: 1.0
bt_navigator:
  ros__parameters:
    global_frame: odom
    robot_base_frame: base_footprint
    # Same reasoning as controller_server's odom_topic above: /odom (wheel encoders) reads a
    # systematic bias under sand slip, not just noise, so any BT node that consults this
    # (e.g. a stuck/velocity check) should see the same ground-truth velocity
    # mobility_watchdog already trusts, not the wheels' own confident-but-wrong one.
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
      # default_nav_to_pose_bt_xml is set by navigation.launch.py: it is an absolute path
      # into this package's share directory, which only the launch file can resolve.
waypoint_follower:
  ros__parameters:
    loop_rate: 20
    # false: an unreachable waypoint is skipped rather than abandoning the run.
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      # MILLISECONDS: this is 0.2 s, not 200 s.
      waypoint_pause_duration: 200
# Last thing between nav2 and the wheels, and what actually publishes onto twist_mux's
# navigation input (via the cmd_vel_smoothed remap in navigation.launch.py).
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    enable_stamped_cmd_vel: true
    # [x, y, theta]; y is zero because the rover cannot strafe. Theta must match
    # safe_speed.yaml or this becomes a second, hidden ceiling -- at 0.2 it silently fixed
    # the minimum turning radius at 0.4/0.2 = 2.0 m and no controller tuning could help.
    # [0.28, 0.0, 0.28] = 30% off. This is the binding ceiling for ALL THREE controllers,
    # so it is the one value to change if the reduction ever needs undoing in a hurry.
    max_velocity: [0.28, 0.0, 0.28]
    min_velocity: [-0.28, 0.0, -0.28]
    # Theta matches RPP's max_angular_accel and MPPI's az_max; whichever is lower binds.
    max_accel: [1.0, 0.0, 3.2]
    max_decel: [-1.0, 0.0, -3.2]
    odom_topic: "/odom"
    odom_duration: 0.1
    # Zero on purpose. A deadband here risks a ramp-up deadlock: with OPEN_LOOP feedback the
    # smoother ramps from its own last output, so a first step below the deadband is zeroed
    # and it can never build speed.
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
