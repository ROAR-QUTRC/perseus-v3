# Parameters for everything navigation.launch.py brings up: the terrain costmap and the
# global planner that consumes it.
#
#     /Laser_map  ->  global_traversability  ->  /costmap  ->  planner_server  ->  /plan
#
# The two halves are separated below. They are in one file because they are one pipeline and
# every threshold in the first half is a decision the second half then plans against -- a
# false obstacle here is a path that detours around nothing there.
#
# ============================================================================
# TERRAIN COSTMAP -- global_traversability
# ============================================================================
global_traversability:
  ros__parameters:
    # FAST-LIO's accumulated map cloud (see config/livox_mid360.yaml's publish.map_en). It is
    # republished in full on every scan, so this node caches it and only reprocesses on
    # update_period_s below.
    pointcloud_topic: "/Laser_map"
    resolution_m: 0.1
    map_margin_m: 1.0
    update_period_s: 5.0
    # Local plane fit (steepness/roughness/ridge)
    neighbourhood_radius_m: 0.3
    min_plane_fit_points: 4
    # Height a point must clear a cell's ground estimate by to count as an overhead return,
    # rather than ground-return noise, when computing clearance. Do not raise this much:
    # boulder cells report a minimum clearance of 0.06, so 0.05 is already close to the
    # returns that detect them.
    ground_margin_m: 0.15
    # Cells with fewer points than this are border/unknown rather than mapped ground.
    #
    # This is the parameter that decides whether rocks are seen at all, and 3 was too high.
    # _compute_obstacle() skips border cells outright, and with treat_unknown_as_obstacle
    # false they come out as FREE space -- so a sparsely-sampled rock is not merely missed,
    # it is actively published as drivable. Measured against the seven 30-40 cm boulders in
    # the Lunabotics sim world, of the 49 cells (7x7 at 0.1 m) around each boulder:
    #
    #     min_points_per_cell    border cells    obstacle cells per boulder
    #     3                      33 - 46         2, 3, 12, 4, 2, 2, 2
    #     2                       1 -  8         4, 6, 17, 7, 4, 6, 6
    #     1                       1 -  8         4, 5, 17, 8, 6, 4, 6
    #
    # 2 and 1 perform the same and neither adds a single false positive, so 2 keeps a
    # two-point minimum as cheap protection against one stray return on the real MID-360.
    min_points_per_cell: 2
    # Obstacle thresholds. Measured on the mapped arena, boulder cells vs open ground:
    #
    #     layer         boulders        open ground     verdict
    #     clearance     0.06 - 0.08     none at all     the detector that actually works
    #     roughness     0.042 - 0.078   0.003 - 0.015   separates, but see below
    #     steepness     6.3 - 17.1 deg  0 - 13.5 deg    overlaps; useless for rocks here
    #
    # There is no longer an in-cell max(z)-min(z) test; see max_height_above_ground_m.
    # Keep at 30. Open ground in this arena already reaches 13.5 deg, so tightening this
    # towards the boulders' 6.3-17.1 deg range buys nothing and starts flagging flat regolith.
    max_slope_deg: 30.0
    # Leave at 0.08. It looks loose next to the boulders' 0.042-0.078, but tightening it is
    # the single worst thing you can do here -- false-positive cells inside the arena, at
    # otherwise unchanged settings:
    #
    #     0.080 -> 1     0.040 -> 22     0.030 -> 74     0.025 -> 125
    #
    # and detection stays at 7/7 throughout, so every one of those is pure loss.
    max_roughness_m: 0.08
    # THE VERTICAL TEST. A cell is an obstacle if its points rise more than
    # max_height_above_ground_m above a RANSAC plane fitted to the surrounding
    # terrain. The plane follows a berm rather than flagging it, so this asks
    # "is something standing up here" rather than "how much vertical spread is
    # here" -- the latter (max(z)-min(z) inside one cell) counted a slope, a
    # cell straddling two map layers, and a rock identically, and has been
    # removed.
    #
    # Set expectations from the measurement: on rosbag2_1970_01_01-10_31_15's
    # /Laser_map the swap moved 4034 -> 4069 obstacle cells, i.e. nothing. This
    # test only ever decides ~60 of those cells on its own -- see the ablation
    # under min_clearance_m below. It is here because it is the better-defined
    # test, not because it fixes the false obstacles.
    #
    # Residual within which a point counts as lying on the ground plane. Swept
    # 0.08 / 0.10 / 0.15 / 0.20: identical results. Two map layers at the same
    # xy cannot both be inliers of one plane whatever the band, which is why
    # this dial does nothing on this data.
    ransac_inlier_m: 0.20
    # Height above the plane that counts as an obstacle. Swept 0.10 / 0.15 /
    # 0.25 -> 4069 / 4049 / 4045 cells. This is the sensitivity dial, and its
    # whole range is worth 24 cells.
    max_height_above_ground_m: 0.20
    # Square the plane is fitted over, plus a one-patch halo so neighbouring
    # planes overlap. Must be well clear of the 30-40 cm boulders or one becomes
    # its own ground and vanishes.
    ransac_patch_m: 1.0
    ransac_iterations: 40
    # Smallest run of connected obstacle cells that is published; smaller blobs
    # are erased (8-connected, so a corner touch still counts). 1 disables it.
    #
    # This is a filter on a symptom, and the symptom is that the map is
    # vertically inconsistent with itself: BIEVR-LIO's z wanders, so two passes
    # over the same ground write it at different heights and a cell straddling
    # them clears max_height_above_ground_m without anything being there. Measured
    # z spread per quarter of a run: 0.30 m before huber_delta was tuned, 0.115 m
    # after -- still above the 0.10 m threshold, hence the residue this catches.
    #
    # 4 because a 30-40 cm boulder covers 9-16 cells at resolution_m 0.1, so it
    # cannot erase one. Measured by replaying rosbag2_1970_01_01-10_31_15's
    # /Laser_map through this node:
    #
    #     min_obstacle_cells    obstacle cells    removed
    #     1 (off)                         4034          -
    #     4                               3672    362  (9.0%)
    #     12                              3301    733 (18.2%)
    #
    # The cells it removes had a median height spread of 0.144-0.152 m, i.e.
    # marginal ones just over the threshold rather than anything solid. They cost
    # more than their count suggests: inflation_radius_m below turns each one
    # into a 0.45 m disc of no-go in otherwise drivable ground.
    #
    # Do not raise this much without checking the boulders are still seen -- 12
    # is already approaching the size of a real rock.
    #
    # The bigger lever is upstream: huber_delta 0.1 -> 0.01 in bievr_mid360.yaml
    # took flagged cells from 2361 to 816 on identical LiDAR input, 65% against
    # this filter's 9%.
    min_obstacle_cells: 4
    # THIS is the test that flags your flat ground, not the height one. Ablation
    # on rosbag2_1970_01_01-10_31_15, disabling one test at a time:
    #
    #     all four on          4034 obstacle cells
    #     clearance off        2955   (-1079)   <-- dominant
    #     steepness off        3803   ( -231)
    #     vertical off         3977   (  -57)
    #     roughness off        3990   (  -44)
    #
    # And the 1079 sit in a narrow band. Sweeping this parameter:
    #
    #     0.60 0.25 0.15 0.10 -> 4034 (identical)
    #     0.05 0.00           -> 2955
    #
    # So every offending cell has clearance between ground_margin_m (0.05) and
    # 0.10 m. That is not overhead structure -- an open sand arena has none --
    # it is the LIO writing the same ground twice, 5-10 cm apart, and the
    # clearance test reading the upper copy as a low ceiling.
    #
    # Lowering this to 0.05 removes all 1079 but disables the test in practice.
    # Raising ground_margin_m above the layering band is the targeted fix, since
    # it stops those returns counting as overhead at all while leaving the 0.6 m
    # requirement intact for anything real. Try ground_margin_m: 0.12 and check
    # the boulders survive -- their minimum clearance is around 0.06, so this
    # trades directly against detecting them and must be measured, not assumed.
    min_clearance_m: 0.6
    # false: a cell with fewer than min_points_per_cell returns is published as -1
    # (unknown) rather than as cost 100. It is the first of THREE settings that together
    # decide whether the rover may route across ground the lidar has never seen -- the
    # other two are allow_unknown (planner) and the local costmap's track_unknown_space.
    # Flipping one without the others gives an incoherent stack, so they cross-reference
    # each other; search UNMAPPED GROUND in this file to find all three.
    #
    # true is the conservative choice -- unmapped ground is not drivable ground, and a
    # rover that cannot see the terrain cannot know it is not a hole. It is false here
    # because the MID-360's occlusion shadows leave unmapped pockets inside otherwise
    # known terrain, and treating those as walls makes the map unnavigable.
    treat_unknown_as_obstacle: false
    # Inflation (mirrors nav2 InflationLayer's own robot_radius/inflation_radius/
    # cost_scaling_factor semantics)
    robot_radius_m: 0.3
    inflation_radius_m: 0.45
    cost_scaling_factor: 3.0
# ============================================================================
# GLOBAL PLANNER -- nav2 planner_server
# ============================================================================
# nav2's global planner ON ITS OWN -- no bt_navigator, no controller_server, no
# behavior_server. planner_server is a self-contained lifecycle node that owns a costmap and
# answers the ComputePathToPose action, so it can be brought up and exercised without
# anything that drives the wheels. That is deliberate: it makes a bad path a thing you look
# at in rviz rather than a thing the rover does.
#
# It consumes global_traversability's /costmap through nav2's static layer, so the terrain
# analysis above is what the planner plans against. See global_costmap for the settings that
# make that work, four of which are wrong by default.
planner_server:
  ros__parameters:
    # Only warns when planning takes longer than this implies. Nothing here plans on a
    # timer -- plans are requested by action -- so this exists to catch a planner that has
    # become too slow to be useful on the Orange Pi, not to schedule anything.
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      # NavFn: Dijkstra/A* over the costmap grid, ignoring the robot's heading. Correct
      # first choice here because the rover is skid-steer and can turn on the spot, so a
      # path that ignores heading is one it can actually follow.
      #
      # nav2_smac_planner::SmacPlannerHybrid is the upgrade if paths ever need to respect a
      # turning radius; it costs much more CPU and needs its own tuning, so it is not where
      # to start.
      plugin: "nav2_navfn_planner::NavfnPlanner"
      # How close to the requested goal counts as reaching it, in metres, when the goal
      # itself is in an occupied or unreachable cell. 0.5 is loose enough that a goal
      # clicked slightly inside an obstacle still plans.
      tolerance: 0.5
      # Dijkstra rather than A*. NavFn's A* is a known-weak implementation that produces
      # worse paths for a speedup that does not matter at this map size.
      use_astar: false
      # UNMAPPED GROUND (2 of 3). true lets NavFn route through NO_INFORMATION cells.
      #
      # This only does anything because treat_unknown_as_obstacle is false upstream: if
      # unmapped cells arrived as cost 100 they would be LETHAL, not unknown, and no
      # amount of permissiveness here would let the planner cross them.
      #
      # With it false the planner refuses any route that touches an unmapped cell, which
      # on a lidar map with occlusion shadows means it frequently cannot find a path at
      # all -- and reports NO_VALID_PATH rather than anything that names the real cause.
      #
      # The risk is real and worth saying plainly: the rover will now plan across ground
      # it has never sensed. It cannot tell open sand from a drop-off there.
      allow_unknown: true
# The planner's costmap. Note the doubled key -- Costmap2DROS runs as its own node called
# global_costmap inside planner_server, so its parameters live one level deeper than the
# server's own. This nesting is required, not stylistic.
global_costmap:
  global_costmap:
    ros__parameters:
      # THERE IS NO map FRAME ON THIS ROBOT. BIEVR-LIO publishes its world frame as odom
      # (map.frame in bievr_mid360.yaml) and the EKF owns odom -> base_link, so odom IS the
      # global frame here and nothing publishes map -> odom. Setting this to "map" is the
      # single most likely way to get a planner that never receives a costmap.
      global_frame: odom
      # The flattened frame from footprint_broadcaster, launched by localisation.launch.py.
      # Using base_link instead would tilt the footprint with the rover's pitch.
      robot_base_frame: base_footprint
      # Matches global_traversability's own robot_radius_m in navigation.yaml. It is only
      # used for footprint checks here -- inflation is not done in this costmap, see below.
      robot_radius: 0.3
      # global_traversability republishes on its own update_period_s (5.0 s). Polling faster
      # than that just re-copies an unchanged grid.
      update_frequency: 1.0
      publish_frequency: 1.0
      # A global costmap that covers the whole known map, not a window around the robot.
      rolling_window: false
      # width/height/resolution are deliberately absent: the static layer resizes the master
      # costmap to whatever /costmap arrives with, so hardcoding them here would only be a
      # second source of truth to get out of sync with navigation.yaml's resolution_m.
      #
      # THE FOUR SETTINGS THAT DECIDE HOW /costmap IS INTERPRETED, and the reason they sit
      # HERE rather than under static_layer below.
      #
      # StaticLayer reads these five from the COSTMAP NODE's own parameter namespace, not
      # from its own layer-prefixed one -- it calls node->get_parameter("trinary_costmap")
      # where every other option goes through declareParameter() and picks up a
      # "static_layer." prefix. Nesting them under static_layer: is silently ignored: no
      # warning, no error, the defaults just stay in force. Verified on nav2 1.3.12 by
      # reading them back off the live node --
      #
      #     ros2 param get /global_costmap/global_costmap trinary_costmap
      #
      # -- which reported "Parameter not set" for static_layer.trinary_costmap while the
      # unprefixed name held the default True.
      #
      # trinary_costmap true -- the default -- collapses every value below
      # lethal_cost_threshold to FREE_SPACE, so the whole 0-99 inflation gradient
      # global_traversability computes would arrive at the planner as open ground. Measured
      # against a synthetic costmap with a lethal wall and this node's own inflation curve,
      # as the highest input cost the returned path passed through:
      #
      #     nested under static_layer (ignored)    99   -- path grazed the wall at 0.02 m
      #     at this level                          42   -- 103 of 104 poses on cost-0 ground
      #
      # false keeps the gradient, scaled into nav2's 0-254 range.
      trinary_costmap: false
      # global_traversability writes 100 for an obstacle cell and 99 for "inside the robot
      # radius of one" (see _compute_final_cost). Both are places the robot's centre cannot
      # be, so both should come out LETHAL. At the default 100, a 99 cell becomes 251 --
      # expensive but passable, which is how the rover ends up planning through its own
      # inflation. Everything below 99 scales linearly into 0-254.
      lethal_cost_threshold: 99
      # -1 in the OccupancyGrid arrives as 255 and becomes NO_INFORMATION rather than free
      # space. Kept true on the PLANNER's costmap so unmapped ground stays distinguishable
      # from open ground: allow_unknown above is then what decides whether to cross it, and
      # the distinction is still there in rviz and in the error codes. Note the local
      # costmap deliberately sets this the other way -- see the note there.
      track_unknown_space: true
      unknown_cost_value: 255
      # ONE LAYER. No obstacle_layer (there is no live sensor feed into this costmap; the
      # terrain analysis is upstream) and no inflation_layer -- global_traversability
      # already inflates, so adding nav2's would inflate the inflation.
      plugins: ["static_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # global_traversability's costmap publisher. Its node has no namespace and the
        # publisher name is relative, so it resolves to /costmap.
        map_topic: /costmap
        # The publisher is transient_local (see the latched_qos comment in
        # global_traversability.cpp). Leaving this false is a QoS mismatch: the subscription
        # is created, no error is printed, and no message is ever delivered.
        map_subscribe_transient_local: true
        subscribe_to_updates: false
# planner_server is a lifecycle node: launched, it sits unconfigured and answers nothing.
# This drives it to active on startup, and is why the launch file does not need a hand-run
# `ros2 lifecycle set`. Named for navigation rather than for path planning because it is
# the launch file's manager -- add any further nav2 lifecycle nodes to node_names here.
lifecycle_manager_navigation:
  ros__parameters:
    autostart: true
    # node_names is NOT set here -- navigation.launch.py sets it, because it has to match
    # exactly which nodes that launch actually started (use_planner / use_control). Naming
    # a node that was never launched leaves the manager waiting on a bond that never forms
    # and reports the whole bringup as failed.
    bond_timeout: 4.0
# ============================================================================
# DRIVING THE ROVER -- controller, behaviours, BT navigator, waypoints
# ============================================================================
# Everything below this line can MOVE THE ROVER. Above it, nothing could.
#
# HOW A VELOCITY REACHES THE WHEELS, and where to cut it:
#
#   controller_server --/cmd_vel--> velocity_smoother --/cmd_vel_nav_stamped-->
#     twist_mux --/cmd_vel_out--> diff_drive_base_controller --> VESCs
#
# twist_mux (perseus/config/twist_mux.yaml) gives navigation priority 10 and the
# JOYSTICK priority 100, so touching the stick takes the rover off nav2 instantly and
# holds it for the 0.5 s timeout. That is the first stop. The e-stop is the real one.
#
# Speeds here must stay at or under perseus/config/safe_speed.yaml (0.8 m/s, 0.4 rad/s),
# which the diff drive controller enforces regardless of what nav2 asks for. Asking for
# more than that just gets clamped somewhere the logs will not tell you about.
#
# THE STALL FLOOR IS A REAL CONSTRAINT HERE. The ESCs stop turning below ~0.34 rad/s at
# the wheel, which is 0.05 m/s at the tyre and about 0.14 rad/s of body yaw. Several nav2
# defaults sit under that -- they are called out individually below. Every one of them is
# a case where nav2 commands a crawl, the wheels do not turn, and the progress checker
# eventually calls it a failure. use_wheel_pid (perseus/config/wheel_pid_chaining.yaml) is
# the mitigation, not a cure.
controller_server:
  ros__parameters:
    # 20.0 is nav2's default. Halved for the Orange Pi: the controller shares the board
    # with BIEVR-LIO and the RANSAC pass in global_traversability.
    controller_frequency: 10.0
    odom_topic: /odom
    # twist_mux is configured use_stamped: true, so nav2 must publish TwistStamped. With
    # this false the messages are the wrong type, twist_mux never sees them, and the rover
    # simply does not move with nothing in any log to say why.
    enable_stamped_cmd_vel: true
    # Velocities below these read as zero. min_x is deliberately well under the stall floor
    # so that "commanded a crawl" stays visible rather than being silently rounded away.
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # Must move 0.5 m every 20 s or the navigation is failed. Loose on purpose: a rover
      # that stalls a wheel, breaks traction on sand, or waits out a slow costmap update is
      # doing something recoverable, and 10 s (nav2's default) fails it too eagerly.
      required_movement_radius: 0.5
      movement_time_allowance: 20.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # 0.25 is nav2's default. Loosened because the rover is 0.6 m across on sand with a
      # skid-steer drivetrain, and asking it to stop within a quarter metre of a point
      # invites it to hunt back and forth across the goal.
      xy_goal_tolerance: 0.35
      # Generous, because the final yaw almost never matters for this rover and tightening
      # it means a slow spin-in-place at exactly the speed the ESCs stall at.
      yaw_goal_tolerance: 0.5
      stateful: true
    FollowPath:
      # Regulated Pure Pursuit rather than DWB. RPP follows the global path and slows for
      # curvature and proximity; it does not do its own obstacle avoidance, which is the
      # right split here because obstacle knowledge lives upstream in global_traversability
      # rather than in a live local sensor feed.
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # Half of safe_speed's 0.8 ceiling. Start slow; this is the number to raise once the
      # rover has been watched driving a full path.
      desired_linear_vel: 0.4
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      # STALL FLOOR. nav2's default is 0.05 m/s, which is exactly the tyre speed at the
      # ESCs' ~0.34 rad/s minimum -- i.e. the approach to every goal is commanded at the
      # precise speed the wheels stop turning at. 0.12 keeps the final approach above it.
      min_approach_linear_velocity: 0.12
      approach_velocity_scaling_dist: 0.6
      use_regulated_linear_velocity_scaling: true
      # Off: this scales speed by costmap cost, and with false obstacles still in the
      # costmap it would crawl across open sand for no reason. Turn it on once the terrain
      # analysis stops flagging flat ground.
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      # The rover is skid-steer and turns on the spot, so turning to face the path before
      # driving it is both possible and the natural motion.
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      # STALL FLOOR AGAIN. nav2's default is 1.8 rad/s, above safe_speed's 0.4 ceiling, so
      # it would be clamped to 0.4 anyway. Setting it here makes that explicit. 0.4 rad/s
      # of body yaw is 0.97 rad/s at the wheel, comfortably clear of the stall floor --
      # do NOT lower this below about 0.15 or in-place turns will simply not happen.
      rotate_to_heading_angular_vel: 0.4
      max_angular_accel: 1.0
      # Cannot be true at the same time as use_rotate_to_heading; the controller rejects it.
      allow_reversing: false
      max_robot_pose_search_dist: 10.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      transform_tolerance: 0.2
# The controller's costmap: a window that travels with the rover, filled from the SAME
# /costmap as the global one.
#
# Deliberately not a live sensor layer. A voxel/obstacle layer off the raw MID-360 would
# flag the ground itself as an obstacle -- it is a 3D lidar, the ground is a return like
# any other -- so the ground segmentation in global_traversability is what makes this
# meaningful, and re-deriving it here from raw returns would be worse, not fresher.
#
# THE LIMITATION THAT COMES WITH THAT: this window is only as current as
# global_traversability's update_period_s (5.0 s). The rover cannot react to something that
# appears in front of it inside that window. Do not drive it near anything that moves.
local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_footprint
      robot_radius: 0.3
      update_frequency: 5.0
      publish_frequency: 2.0
      # Travels with the rover, unlike the global costmap.
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.1
      # Per-costmap-node, so they must be repeated here -- setting them on the global
      # costmap does not reach this one. See the long note in the global_costmap block for
      # why nesting them under static_layer silently does nothing.
      trinary_costmap: false
      lethal_cost_threshold: 99
      unknown_cost_value: 255
      # UNMAPPED GROUND (3 of 3), AND IT IS THE OPPOSITE OF THE GLOBAL COSTMAP. Deliberate.
      #
      # NO_INFORMATION is 255, and every nav2 collision check treats anything at or above
      # INSCRIBED_INFLATED_OBSTACLE (253) as a collision. So on the CONTROLLER's costmap,
      # track_unknown_space true means unmapped ground is indistinguishable from a wall:
      # RegulatedPurePursuitController's use_collision_detection sees the robot boxed in,
      # commands zero linear and zero angular, and reports nothing -- the rover sits still
      # until the progress checker times out with "Failed to make progress".
      #
      # That is a silent stall, not an error, and it happens even where the global planner
      # produced a perfectly good path. false makes unmapped ground read as free HERE, so
      # the controller will actually drive the path the planner allowed it to make.
      #
      # The asymmetry is the point: the planner decides whether to enter unknown ground
      # (allow_unknown), and the controller does not get a second veto over that decision.
      track_unknown_space: false
      plugins: ["static_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /costmap
        map_subscribe_transient_local: true
        subscribe_to_updates: false
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    # The three the default behaviour tree actually calls. AssistedTeleop exists but has no
    # place on a rover whose teleop already outranks nav2 in twist_mux.
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    enable_stamped_cmd_vel: true
    # STALL FLOOR, third time. min_rotational_vel is nav2's floor for a recovery spin and
    # defaults to 0.4 -- fine here by coincidence. max matches safe_speed's ceiling.
    max_rotational_vel: 0.4
    min_rotational_vel: 0.4
    rotational_acc_lim: 1.0
bt_navigator:
  ros__parameters:
    # odom, not map. See the global_costmap block: this robot has no map frame.
    global_frame: odom
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
      # No default_nav_to_pose_bt_xml: nav2's own
      # navigate_to_pose_w_replanning_and_recovery.xml is the right tree to start from, and
      # naming it here would pin a path into the nix store.
waypoint_follower:
  ros__parameters:
    loop_rate: 20
    # false: one unreachable waypoint skips to the next rather than abandoning the run.
    # Set true if a missed waypoint should stop everything.
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      # MILLISECONDS, not seconds -- this is 0.2 s, not 200 s. Long enough that the rover
      # visibly settles at each waypoint.
      waypoint_pause_duration: 200
# Last thing between nav2 and the wheels. It bounds acceleration, so a controller that
# jumps its output cannot ask the drivetrain for a step change, and it is what actually
# publishes onto twist_mux's navigation input.
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    enable_stamped_cmd_vel: true
    # [x, y, theta]. Matches safe_speed.yaml; y is zero because the rover cannot strafe.
    max_velocity: [0.8, 0.0, 0.4]
    min_velocity: [-0.8, 0.0, -0.4]
    max_accel: [1.0, 0.0, 2.0]
    max_decel: [-1.0, 0.0, -2.0]
    odom_topic: "/odom"
    odom_duration: 0.1
    # Anything under this is published as zero. Set to the ESC stall floor at the tyre so
    # the smoother stops asking for speeds the drivetrain cannot produce, instead of
    # trickling out commands that leave the wheels stationary.
    deadband_velocity: [0.05, 0.0, 0.14]
    velocity_timeout: 1.0
