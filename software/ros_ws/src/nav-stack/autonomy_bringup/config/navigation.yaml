# Everything navigation.launch.py brings up: the terrain costmap, the global planner, and
# the nav2 stack that drives to a goal.
#
#   /Laser_map -> global_traversability -> /costmap -> planner_server   -> /plan
#                                                   -> smoother_server
#                                                   -> controller_server -> /cmd_vel
#                                                   -> velocity_smoother -> /cmd_vel_nav_stamped
#                                                   -> twist_mux -> diff drive -> VESCs
#
# THREE THINGS THAT ARE NOT OBVIOUS AND WILL COST YOU AN AFTERNOON:
#   * There is no map frame. BIEVR-LIO's world frame is odom; nothing publishes map->odom.
#     Every global_frame here is odom.
#   * twist_mux gives navigation priority 10 vs joystick 100 / web_ui 80. If either of those
#     publishes continuously, nav2 never reaches the wheels.
#   * The ESCs stall below ~0.34 rad/s at the wheel = 0.05 m/s at the tyre, 0.14 rad/s of
#     body yaw. Several nav2 defaults sit under that; the ones that matter are marked STALL.
# ============================================================================
# TERRAIN COSTMAP -- global_traversability
# ============================================================================
global_traversability:
  ros__parameters:
    pointcloud_topic: "/Laser_map"
    resolution_m: 0.1
    map_margin_m: 1.0
    update_period_s: 5.0
    # Local plane fit, for steepness/roughness/ridge.
    neighbourhood_radius_m: 0.3
    min_plane_fit_points: 4
    # How far above a cell's ground a point must be to count as overhead rather than
    # ground noise. Raised from 0.05 because LIO z-wander writes the same ground twice
    # 5-10 cm apart, and the clearance test read the upper copy as a low ceiling.
    # Trades against detecting low obstacles: boulder cells report clearance around 0.06.
    ground_margin_m: 0.15
    # Fewer points than this and the cell is unknown, not ground. 3 was too high: it made
    # sparsely-sampled rocks invisible. Measured on 7 sim boulders, 2 and 1 perform the
    # same with no false positives, so 2 keeps a little protection against a stray return.
    min_points_per_cell: 2
    # Open ground here already reaches 13.5 deg, so tightening this flags flat regolith.
    max_slope_deg: 30.0
    # Boulders read 0.042-0.078, open ground 0.003-0.015. Tightening is the worst thing you
    # can do: false positives go 1 -> 22 -> 74 -> 125 at 0.08 / 0.04 / 0.03 / 0.025, with
    # detection unchanged at 7/7 throughout.
    max_roughness_m: 0.08
    # THE VERTICAL TEST: height above a RANSAC ground plane, not max(z)-min(z) in the cell.
    # The plane follows a berm instead of flagging it.
    #
    # Do not expect much from these dials. On rosbag2_1970_01_01-10_31_15 the whole test
    # decides ~60 of 4045 obstacle cells; inlier_m swept 0.08-0.20 and max_height 0.10-0.25
    # were worth 24 cells between them. min_clearance_m below decides far more.
    ransac_inlier_m: 0.20
    max_height_above_ground_m: 0.20
    # Patch the plane is fitted over, plus a one-patch halo so neighbours overlap. Must be
    # well clear of the 30-40 cm boulders or one becomes its own ground and vanishes.
    ransac_patch_m: 1.0
    ransac_iterations: 40
    # Erase obstacle blobs smaller than this (8-connected). A 30-40 cm boulder covers 9-16
    # cells at 0.1 m, so 4 cannot erase one. Removes 362 of 4034 cells (9%), all marginal.
    # A filter on a symptom: the real fix was huber_delta 0.1 -> 0.01 in bievr_mid360.yaml,
    # which took flagged cells 2361 -> 816 on identical LiDAR.
    min_obstacle_cells: 4
    # THE TEST THAT FLAGS YOUR FLAT GROUND. Ablation on the same bag, one test off at a
    # time: clearance -1079, steepness -231, vertical -57, roughness -44. And every
    # offending cell sits between ground_margin_m and 0.10 m of clearance -- not overhead
    # structure, just the map's second copy of the floor. Hence ground_margin_m above.
    min_clearance_m: 0.6
    # false: unmapped cells publish as -1, not cost 100. One of three settings that decide
    # whether the rover may cross ground the lidar has never seen; the others are
    # allow_unknown and the costmaps' track_unknown_space. Search UNMAPPED for all three.
    treat_unknown_as_obstacle: false
    # Inflation, same semantics as nav2's InflationLayer. nav2 does NOT inflate on top of
    # this -- neither costmap loads an inflation layer.
    robot_radius_m: 0.35
    inflation_radius_m: 0.6
    cost_scaling_factor: 3.5
# ============================================================================
# GLOBAL PLANNER -- nav2 planner_server
# ============================================================================
planner_server:
  ros__parameters:
    # Only warns if planning is slower than this; nothing plans on a timer.
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      # NavFn ignores heading, which suits a skid-steer that can turn on the spot. It also
      # plans on the grid, so its paths turn in 45/90 deg steps -- see smoother_server.
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      # NavFn's A* is a weak implementation; Dijkstra gives better paths at this map size.
      use_astar: false
      # UNMAPPED (2 of 3). Lets NavFn route through NO_INFORMATION. Only meaningful because
      # treat_unknown_as_obstacle is false upstream. With it false the planner refused any
      # route touching an occlusion shadow and reported NO_VALID_PATH instead of the cause.
      # The risk is real: the rover cannot tell open sand from a drop-off out there.
      allow_unknown: true
# The planner's costmap. Doubled key because Costmap2DROS runs as its own node named
# global_costmap inside planner_server. Required, not stylistic.
global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_footprint
      robot_radius: 0.3
      # /costmap only republishes every update_period_s (5 s); polling faster re-copies it.
      update_frequency: 1.0
      publish_frequency: 1.0
      rolling_window: false
      # width/height/resolution omitted on purpose: the static layer resizes the master
      # costmap to whatever /costmap arrives with.
      #
      # THESE FOUR LIVE HERE, NOT UNDER static_layer. StaticLayer reads them from the
      # costmap node's own namespace while every other option picks up a "static_layer."
      # prefix. Nesting them below is silently ignored -- no warning, defaults stay in
      # force. Verified: `ros2 param get /global_costmap/global_costmap trinary_costmap`
      # returned the default while static_layer.trinary_costmap read "Parameter not set".
      #
      # trinary_costmap true (the default) collapses everything under lethal_cost_threshold
      # to FREE_SPACE, throwing away the whole 0-99 inflation gradient. Measured as the
      # highest input cost the returned path crossed: 99 (grazing a wall at 0.02 m) with it
      # nested and ignored, 42 with it set here.
      trinary_costmap: false
      lethal_cost_threshold: 100
      # UNMAPPED (3 of 3). NO_INFORMATION is 255 and every collision check treats >= 253 as
      # a collision, so tracking unknown makes unmapped ground indistinguishable from a
      # wall -- RPP commands zero and the rover stalls silently until the progress checker
      # gives up. false makes unmapped ground read as free.
      track_unknown_space: false
      unknown_cost_value: 255
      # One layer. No obstacle layer (no live sensor feed here) and no inflation layer
      # (global_traversability already inflated).
      plugins: ["static_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /costmap
        # global_traversability publishes transient_local. Leaving this false is a QoS
        # mismatch: subscription created, no error logged, no message ever delivered.
        map_subscribe_transient_local: true
        subscribe_to_updates: false
lifecycle_manager_navigation:
  ros__parameters:
    autostart: true
    # node_names is set by navigation.launch.py, to match what that launch actually
    # started. Naming a node that was never launched hangs bringup on a bond that never
    # forms. Raise bond_timeout if bringup fails under load on the Orange Pi.
    bond_timeout: 4.0
# ============================================================================
# DRIVING THE ROVER -- everything below here can move it
# ============================================================================
controller_server:
  ros__parameters:
    # 20.0 is nav2's default; halved for the Orange Pi, which also runs BIEVR-LIO.
    controller_frequency: 10.0
    odom_topic: /odom
    # twist_mux is use_stamped: true. With this false the message type is wrong, twist_mux
    # never sees it, and the rover does not move with nothing in any log to say why.
    enable_stamped_cmd_vel: true
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    # Both loaded; the active one is chosen per goal via ControllerSelector, defaulting to
    # FollowPath in the behaviour tree.
    controller_plugins: ["FollowPath", "DWB"]
    progress_checker:
      # Loose on purpose: a stalled wheel, lost traction on sand, or a slow costmap update
      # are all recoverable, and nav2's 10 s default fails them too eagerly.
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 20.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # Loosened from 0.25: the rover is 0.6 m across on sand and hunts across a tighter
      # goal. Yaw is generous because final heading rarely matters and tightening it means
      # a slow spin at exactly the rate the ESCs stall at.
      xy_goal_tolerance: 0.35
      yaw_goal_tolerance: 0.5
      stateful: true
    FollowPath:
      # Follows the global path and regulates speed on curvature; it does not do its own
      # obstacle avoidance, which is right because obstacle knowledge lives upstream.
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.4
      # THE CORNERING TRADE. Long lookahead puts the carrot past a corner and asks for
      # gentler curvature, so it cuts corners; short lookahead tracks corners but weaves on
      # straights. Raise these if it weaves; lower them if it cuts.
      lookahead_dist: 0.6
      min_lookahead_dist: 0.4
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      # STALL. nav2's 0.05 default is exactly the tyre speed at the ESCs' minimum, i.e.
      # every goal approach commanded at the speed the wheels stop turning.
      min_approach_linear_velocity: 0.12
      approach_velocity_scaling_dist: 0.6
      use_regulated_linear_velocity_scaling: true
      # Off while the costmap still has false obstacles, or it crawls across open sand.
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      # Sets the tightest arc available, since radius = speed / angular ceiling:
      # 0.15 / 0.4 = 0.38 m, about one half-track. Cannot go much lower -- 0.15 m/s is only
      # 3x the ~0.05 m/s tyre stall speed.
      regulated_linear_scaling_min_speed: 0.15
      # Above this heading error the rover stops and pivots instead of arcing. That is the
      # only way to take a corner tighter than 0.38 m, which is most NavFn grid corners --
      # though smoother_server now removes many of them, so this can sit higher than it
      # otherwise would.
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.8
      # Rotate-to-heading is BANG-BANG: full rate until the error drops under the threshold,
      # no proportional slow-down. So this value alone sets the overshoot -- roughly 5 deg
      # at 0.4 rad/s, 2.5 deg at 0.25, before wheel scrub. STALL: 0.25 rad/s of body yaw is
      # 0.61 rad/s at the wheel; below ~0.15 the wheels stop mid-rotation and it hunts.
      rotate_to_heading_angular_vel: 0.25
      # Must be matched by velocity_smoother's max_accel below; the lower one binds.
      max_angular_accel: 3.2
      # Cannot be true alongside use_rotate_to_heading; the controller rejects it.
      allow_reversing: false
      max_robot_pose_search_dist: 10.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      transform_tolerance: 0.2
    DWB:
      # Alternative to FollowPath: samples trajectories and scores them, so unlike RPP it
      # does avoid obstacles locally. Costs much more CPU.
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true
      min_vel_x: 0.0
      min_vel_y: 0.0
      # y is zero throughout: the rover cannot strafe. Limits match safe_speed.yaml.
      max_vel_x: 0.4
      max_vel_y: 0.0
      max_vel_theta: 0.4
      max_speed_xy: 0.4
      # STALL: both floors sit above the ESCs' 0.05 m/s and 0.14 rad/s.
      min_speed_xy: 0.06
      min_speed_theta: 0.15
      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      # vy_samples 1 because there is no lateral motion to sample.
      vx_samples: 10
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.35
      trans_stopped_velocity: 0.1
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      # BaseObstacle is deliberately near-zero: the costmap's own inflation already encodes
      # obstacle cost, so scoring it again double-counts. The Path/Goal critics dominate.
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
# The controller's costmap: a window travelling with the rover, filled from the SAME
# /costmap as the global one.
#
# Not a live sensor layer on purpose -- a voxel layer off the raw MID-360 would flag the
# ground itself. The cost is latency: this is only as fresh as global_traversability's
# 5 s update, so the rover cannot react to anything that appears in front of it.
local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_footprint
      robot_radius: 0.3
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.1
      # Per-costmap-node, so they must be repeated here; setting them on the global costmap
      # does not reach this one. Same reasons as there.
      trinary_costmap: false
      lethal_cost_threshold: 100
      unknown_cost_value: 255
      track_unknown_space: false
      plugins: ["static_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /costmap
        map_subscribe_transient_local: true
        subscribe_to_updates: false
# Smooths NavFn's grid path before the controller sees it. Called from the behaviour tree
# in behavior_trees/navigate_to_pose_w_smoothing.xml, NOT automatically -- nav2's stock
# tree never calls SmoothPath, so this server would sit idle without that file.
#
# This is the fix for both cornering failures at once: NavFn turns in 45/90 deg steps on a
# 0.1 m grid, the tightest arc the rover can drive is 0.38 m, so every grid corner had to
# be either cut or pivoted through and no controller tuning changes that.
#
# NavigateThroughPoses -- and therefore waypoint following -- still uses nav2's stock tree
# and is NOT smoothed.
smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      # Trades staying near the planned path (w_data) against straightening it (w_smooth).
      # More smoothing pulls away from the clearance the planner left, which is why the
      # behaviour tree runs it with check_for_collisions true.
      w_data: 0.2
      w_smooth: 0.3
      tolerance: 1.0e-10
      # The real budget is max_smoothing_duration (0.2 s) in the behaviour tree.
      max_its: 1000
      do_refinement: true
      refinement_num: 2
    # Collision checking reads the PLANNER's costmap, so it rejects a smoothed path against
    # the same terrain analysis the path was planned on.
    costmap_topic: global_costmap/costmap_raw
    footprint_topic: global_costmap/published_footprint
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    # The three the default tree calls. AssistedTeleop has no place on a rover whose teleop
    # already outranks nav2 in twist_mux.
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    enable_stamped_cmd_vel: true
    # STALL: min_rotational_vel is the floor for a recovery spin, and 0.4 clears it.
    max_rotational_vel: 0.4
    min_rotational_vel: 0.4
    rotational_acc_lim: 1.0
bt_navigator:
  ros__parameters:
    global_frame: odom
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # default_nav_to_pose_bt_xml is set by navigation.launch.py: it is an absolute path
    # into this package's share directory, which only the launch file can resolve.
waypoint_follower:
  ros__parameters:
    loop_rate: 20
    # false: an unreachable waypoint is skipped rather than abandoning the run.
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      # MILLISECONDS: this is 0.2 s, not 200 s.
      waypoint_pause_duration: 200
# Last thing between nav2 and the wheels, and what actually publishes onto twist_mux's
# navigation input (via the cmd_vel_smoothed remap in navigation.launch.py).
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    enable_stamped_cmd_vel: true
    # [x, y, theta]; y is zero because the rover cannot strafe. Theta must match
    # safe_speed.yaml or this becomes a second, hidden ceiling -- at 0.2 it silently fixed
    # the minimum turning radius at 0.4/0.2 = 2.0 m and no controller tuning could help.
    max_velocity: [0.4, 0.0, 0.4]
    min_velocity: [-0.4, 0.0, -0.4]
    # Theta matches FollowPath's max_angular_accel; whichever is lower binds.
    max_accel: [1.0, 0.0, 3.2]
    max_decel: [-1.0, 0.0, -3.2]
    odom_topic: "/odom"
    odom_duration: 0.1
    # Zero on purpose. A deadband here risks a ramp-up deadlock: with OPEN_LOOP feedback the
    # smoother ramps from its own last output, so a first step below the deadband is zeroed
    # and it can never build speed.
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
