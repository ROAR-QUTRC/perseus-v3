# Parameters for everything navigation.launch.py brings up: the terrain costmap and the
# global planner that consumes it.
#
#     /Laser_map  ->  global_traversability  ->  /costmap  ->  planner_server  ->  /plan
#
# The two halves are separated below. They are in one file because they are one pipeline and
# every threshold in the first half is a decision the second half then plans against -- a
# false obstacle here is a path that detours around nothing there.
#
# ============================================================================
# TERRAIN COSTMAP -- global_traversability
# ============================================================================
global_traversability:
  ros__parameters:
    # FAST-LIO's accumulated map cloud (see config/livox_mid360.yaml's publish.map_en). It is
    # republished in full on every scan, so this node caches it and only reprocesses on
    # update_period_s below.
    pointcloud_topic: "/Laser_map"
    resolution_m: 0.1
    map_margin_m: 1.0
    update_period_s: 5.0
    # Local plane fit (steepness/roughness/ridge)
    neighbourhood_radius_m: 0.3
    min_plane_fit_points: 4
    # Height a point must clear a cell's ground estimate by to count as an overhead return,
    # rather than ground-return noise, when computing clearance. Do not raise this much:
    # boulder cells report a minimum clearance of 0.06, so 0.05 is already close to the
    # returns that detect them.
    ground_margin_m: 0.15
    # Cells with fewer points than this are border/unknown rather than mapped ground.
    #
    # This is the parameter that decides whether rocks are seen at all, and 3 was too high.
    # _compute_obstacle() skips border cells outright, and with treat_unknown_as_obstacle
    # false they come out as FREE space -- so a sparsely-sampled rock is not merely missed,
    # it is actively published as drivable. Measured against the seven 30-40 cm boulders in
    # the Lunabotics sim world, of the 49 cells (7x7 at 0.1 m) around each boulder:
    #
    #     min_points_per_cell    border cells    obstacle cells per boulder
    #     3                      33 - 46         2, 3, 12, 4, 2, 2, 2
    #     2                       1 -  8         4, 6, 17, 7, 4, 6, 6
    #     1                       1 -  8         4, 5, 17, 8, 6, 4, 6
    #
    # 2 and 1 perform the same and neither adds a single false positive, so 2 keeps a
    # two-point minimum as cheap protection against one stray return on the real MID-360.
    min_points_per_cell: 2
    # Obstacle thresholds. Measured on the mapped arena, boulder cells vs open ground:
    #
    #     layer         boulders        open ground     verdict
    #     clearance     0.06 - 0.08     none at all     the detector that actually works
    #     roughness     0.042 - 0.078   0.003 - 0.015   separates, but see below
    #     steepness     6.3 - 17.1 deg  0 - 13.5 deg    overlaps; useless for rocks here
    #
    # There is no longer an in-cell max(z)-min(z) test; see max_height_above_ground_m.
    # Keep at 30. Open ground in this arena already reaches 13.5 deg, so tightening this
    # towards the boulders' 6.3-17.1 deg range buys nothing and starts flagging flat regolith.
    max_slope_deg: 30.0
    # Leave at 0.08. It looks loose next to the boulders' 0.042-0.078, but tightening it is
    # the single worst thing you can do here -- false-positive cells inside the arena, at
    # otherwise unchanged settings:
    #
    #     0.080 -> 1     0.040 -> 22     0.030 -> 74     0.025 -> 125
    #
    # and detection stays at 7/7 throughout, so every one of those is pure loss.
    max_roughness_m: 0.08
    # THE VERTICAL TEST. A cell is an obstacle if its points rise more than
    # max_height_above_ground_m above a RANSAC plane fitted to the surrounding
    # terrain. The plane follows a berm rather than flagging it, so this asks
    # "is something standing up here" rather than "how much vertical spread is
    # here" -- the latter (max(z)-min(z) inside one cell) counted a slope, a
    # cell straddling two map layers, and a rock identically, and has been
    # removed.
    #
    # Set expectations from the measurement: on rosbag2_1970_01_01-10_31_15's
    # /Laser_map the swap moved 4034 -> 4069 obstacle cells, i.e. nothing. This
    # test only ever decides ~60 of those cells on its own -- see the ablation
    # under min_clearance_m below. It is here because it is the better-defined
    # test, not because it fixes the false obstacles.
    #
    # Residual within which a point counts as lying on the ground plane. Swept
    # 0.08 / 0.10 / 0.15 / 0.20: identical results. Two map layers at the same
    # xy cannot both be inliers of one plane whatever the band, which is why
    # this dial does nothing on this data.
    ransac_inlier_m: 0.20
    # Height above the plane that counts as an obstacle. Swept 0.10 / 0.15 /
    # 0.25 -> 4069 / 4049 / 4045 cells. This is the sensitivity dial, and its
    # whole range is worth 24 cells.
    max_height_above_ground_m: 0.20
    # Square the plane is fitted over, plus a one-patch halo so neighbouring
    # planes overlap. Must be well clear of the 30-40 cm boulders or one becomes
    # its own ground and vanishes.
    ransac_patch_m: 1.0
    ransac_iterations: 40
    # Smallest run of connected obstacle cells that is published; smaller blobs
    # are erased (8-connected, so a corner touch still counts). 1 disables it.
    #
    # This is a filter on a symptom, and the symptom is that the map is
    # vertically inconsistent with itself: BIEVR-LIO's z wanders, so two passes
    # over the same ground write it at different heights and a cell straddling
    # them clears max_height_above_ground_m without anything being there. Measured
    # z spread per quarter of a run: 0.30 m before huber_delta was tuned, 0.115 m
    # after -- still above the 0.10 m threshold, hence the residue this catches.
    #
    # 4 because a 30-40 cm boulder covers 9-16 cells at resolution_m 0.1, so it
    # cannot erase one. Measured by replaying rosbag2_1970_01_01-10_31_15's
    # /Laser_map through this node:
    #
    #     min_obstacle_cells    obstacle cells    removed
    #     1 (off)                         4034          -
    #     4                               3672    362  (9.0%)
    #     12                              3301    733 (18.2%)
    #
    # The cells it removes had a median height spread of 0.144-0.152 m, i.e.
    # marginal ones just over the threshold rather than anything solid. They cost
    # more than their count suggests: inflation_radius_m below turns each one
    # into a 0.45 m disc of no-go in otherwise drivable ground.
    #
    # Do not raise this much without checking the boulders are still seen -- 12
    # is already approaching the size of a real rock.
    #
    # The bigger lever is upstream: huber_delta 0.1 -> 0.01 in bievr_mid360.yaml
    # took flagged cells from 2361 to 816 on identical LiDAR input, 65% against
    # this filter's 9%.
    min_obstacle_cells: 4
    # THIS is the test that flags your flat ground, not the height one. Ablation
    # on rosbag2_1970_01_01-10_31_15, disabling one test at a time:
    #
    #     all four on          4034 obstacle cells
    #     clearance off        2955   (-1079)   <-- dominant
    #     steepness off        3803   ( -231)
    #     vertical off         3977   (  -57)
    #     roughness off        3990   (  -44)
    #
    # And the 1079 sit in a narrow band. Sweeping this parameter:
    #
    #     0.60 0.25 0.15 0.10 -> 4034 (identical)
    #     0.05 0.00           -> 2955
    #
    # So every offending cell has clearance between ground_margin_m (0.05) and
    # 0.10 m. That is not overhead structure -- an open sand arena has none --
    # it is the LIO writing the same ground twice, 5-10 cm apart, and the
    # clearance test reading the upper copy as a low ceiling.
    #
    # Lowering this to 0.05 removes all 1079 but disables the test in practice.
    # Raising ground_margin_m above the layering band is the targeted fix, since
    # it stops those returns counting as overhead at all while leaving the 0.6 m
    # requirement intact for anything real. Try ground_margin_m: 0.12 and check
    # the boulders survive -- their minimum clearance is around 0.06, so this
    # trades directly against detecting them and must be measured, not assumed.
    min_clearance_m: 0.6
    # Unmapped cells are treated as obstacles: safer default for a vehicle that cannot verify
    # unmapped ground ahead of time.
    treat_unknown_as_obstacle: false
    # Inflation (mirrors nav2 InflationLayer's own robot_radius/inflation_radius/
    # cost_scaling_factor semantics)
    robot_radius_m: 0.3
    inflation_radius_m: 0.45
    cost_scaling_factor: 3.0
# ============================================================================
# GLOBAL PLANNER -- nav2 planner_server
# ============================================================================
# nav2's global planner ON ITS OWN -- no bt_navigator, no controller_server, no
# behavior_server. planner_server is a self-contained lifecycle node that owns a costmap and
# answers the ComputePathToPose action, so it can be brought up and exercised without
# anything that drives the wheels. That is deliberate: it makes a bad path a thing you look
# at in rviz rather than a thing the rover does.
#
# It consumes global_traversability's /costmap through nav2's static layer, so the terrain
# analysis above is what the planner plans against. See global_costmap for the settings that
# make that work, four of which are wrong by default.
planner_server:
  ros__parameters:
    # Only warns when planning takes longer than this implies. Nothing here plans on a
    # timer -- plans are requested by action -- so this exists to catch a planner that has
    # become too slow to be useful on the Orange Pi, not to schedule anything.
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      # NavFn: Dijkstra/A* over the costmap grid, ignoring the robot's heading. Correct
      # first choice here because the rover is skid-steer and can turn on the spot, so a
      # path that ignores heading is one it can actually follow.
      #
      # nav2_smac_planner::SmacPlannerHybrid is the upgrade if paths ever need to respect a
      # turning radius; it costs much more CPU and needs its own tuning, so it is not where
      # to start.
      plugin: "nav2_navfn_planner::NavfnPlanner"
      # How close to the requested goal counts as reaching it, in metres, when the goal
      # itself is in an occupied or unreachable cell. 0.5 is loose enough that a goal
      # clicked slightly inside an obstacle still plans.
      tolerance: 0.5
      # Dijkstra rather than A*. NavFn's A* is a known-weak implementation that produces
      # worse paths for a speedup that does not matter at this map size.
      use_astar: false
      # Unknown cells are already published as cost 100 by global_traversability
      # (treat_unknown_as_obstacle in navigation.yaml), so there is nothing here for the
      # planner to be permissive about. false keeps the two agreeing: unmapped ground the
      # rover cannot verify is not somewhere to route through.
      allow_unknown: false
# The planner's costmap. Note the doubled key -- Costmap2DROS runs as its own node called
# global_costmap inside planner_server, so its parameters live one level deeper than the
# server's own. This nesting is required, not stylistic.
global_costmap:
  global_costmap:
    ros__parameters:
      # THERE IS NO map FRAME ON THIS ROBOT. BIEVR-LIO publishes its world frame as odom
      # (map.frame in bievr_mid360.yaml) and the EKF owns odom -> base_link, so odom IS the
      # global frame here and nothing publishes map -> odom. Setting this to "map" is the
      # single most likely way to get a planner that never receives a costmap.
      global_frame: odom
      # The flattened frame from footprint_broadcaster, launched by localisation.launch.py.
      # Using base_link instead would tilt the footprint with the rover's pitch.
      robot_base_frame: base_footprint
      # Matches global_traversability's own robot_radius_m in navigation.yaml. It is only
      # used for footprint checks here -- inflation is not done in this costmap, see below.
      robot_radius: 0.3
      # global_traversability republishes on its own update_period_s (5.0 s). Polling faster
      # than that just re-copies an unchanged grid.
      update_frequency: 1.0
      publish_frequency: 1.0
      # A global costmap that covers the whole known map, not a window around the robot.
      rolling_window: false
      # width/height/resolution are deliberately absent: the static layer resizes the master
      # costmap to whatever /costmap arrives with, so hardcoding them here would only be a
      # second source of truth to get out of sync with navigation.yaml's resolution_m.
      #
      # THE FOUR SETTINGS THAT DECIDE HOW /costmap IS INTERPRETED, and the reason they sit
      # HERE rather than under static_layer below.
      #
      # StaticLayer reads these five from the COSTMAP NODE's own parameter namespace, not
      # from its own layer-prefixed one -- it calls node->get_parameter("trinary_costmap")
      # where every other option goes through declareParameter() and picks up a
      # "static_layer." prefix. Nesting them under static_layer: is silently ignored: no
      # warning, no error, the defaults just stay in force. Verified on nav2 1.3.12 by
      # reading them back off the live node --
      #
      #     ros2 param get /global_costmap/global_costmap trinary_costmap
      #
      # -- which reported "Parameter not set" for static_layer.trinary_costmap while the
      # unprefixed name held the default True.
      #
      # trinary_costmap true -- the default -- collapses every value below
      # lethal_cost_threshold to FREE_SPACE, so the whole 0-99 inflation gradient
      # global_traversability computes would arrive at the planner as open ground. Measured
      # against a synthetic costmap with a lethal wall and this node's own inflation curve,
      # as the highest input cost the returned path passed through:
      #
      #     nested under static_layer (ignored)    99   -- path grazed the wall at 0.02 m
      #     at this level                          42   -- 103 of 104 poses on cost-0 ground
      #
      # false keeps the gradient, scaled into nav2's 0-254 range.
      trinary_costmap: false
      # global_traversability writes 100 for an obstacle cell and 99 for "inside the robot
      # radius of one" (see _compute_final_cost). Both are places the robot's centre cannot
      # be, so both should come out LETHAL. At the default 100, a 99 cell becomes 251 --
      # expensive but passable, which is how the rover ends up planning through its own
      # inflation. Everything below 99 scales linearly into 0-254.
      lethal_cost_threshold: 99
      # -1 in the OccupancyGrid arrives as 255 and becomes NO_INFORMATION rather than free
      # space. With treat_unknown_as_obstacle true upstream this should never fire for mapped
      # area -- it only covers cells outside the grid_map's own bounds. The default is false,
      # i.e. unmapped ground reads as drivable, which is the wrong way round for a rover that
      # cannot verify it.
      track_unknown_space: true
      unknown_cost_value: 255
      # ONE LAYER. No obstacle_layer (there is no live sensor feed into this costmap; the
      # terrain analysis is upstream) and no inflation_layer -- global_traversability
      # already inflates, so adding nav2's would inflate the inflation.
      plugins: ["static_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # global_traversability's costmap publisher. Its node has no namespace and the
        # publisher name is relative, so it resolves to /costmap.
        map_topic: /costmap
        # The publisher is transient_local (see the latched_qos comment in
        # global_traversability.cpp). Leaving this false is a QoS mismatch: the subscription
        # is created, no error is printed, and no message is ever delivered.
        map_subscribe_transient_local: true
        subscribe_to_updates: false
# planner_server is a lifecycle node: launched, it sits unconfigured and answers nothing.
# This drives it to active on startup, and is why the launch file does not need a hand-run
# `ros2 lifecycle set`. Named for navigation rather than for path planning because it is
# the launch file's manager -- add any further nav2 lifecycle nodes to node_names here.
lifecycle_manager_navigation:
  ros__parameters:
    autostart: true
    node_names: ["planner_server"]
    bond_timeout: 4.0
