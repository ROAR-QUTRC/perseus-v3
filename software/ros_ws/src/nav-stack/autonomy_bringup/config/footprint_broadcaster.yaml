# Parameters for footprint_broadcaster's flat_footprint_broadcaster, launched by
# localisation.launch.py.
#
# The node derives odom -> base_footprint from the odom -> base_link that the EKF owns, so
# it is configured and launched alongside localisation rather than with navigation, even
# though nav2 is the main consumer of the frame.
flat_footprint_broadcaster:
  ros__parameters:
    odom_frame: "odom"
    base_link_frame: "base_link"
    base_footprint_frame: "base_footprint"
    # Matches the EKF's frequency (autonomy_bringup/config/ekf_config.yaml) so
    # base_footprint is never staler than the base_link pose it is derived from.
    publish_rate_hz: 30.0
