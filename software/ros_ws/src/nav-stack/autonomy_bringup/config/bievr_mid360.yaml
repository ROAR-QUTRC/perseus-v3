# BIEVR-LIO on the real Perseus: Livox MID-360 on a Jetson.
#
# The default backend for localisation.launch.py; `lio:=fast_lio` selects
# livox_mid360.yaml instead. The two fill the same slot -- LiDAR-inertial odometry on
# /Odometry for the EKF to fuse -- so they are tuned to produce the same thing, and the
# comments below call out where the two algorithms make the same setting mean different
# things.
#
# Unlike FAST-LIO this is not a ROS parameter file: bievr_lio_ros2 parses plain YAML with
# yaml-cpp and takes the *path* on its command line, so there is no /**: ros__parameters
# wrapper and nothing here is visible to `ros2 param`. Upstream splits it across
# config/params.yaml plus a config/sensor_configs/<robot>.yaml; both are merged per leaf
# key, so a single file carrying both halves is equivalent and is what the launch file
# passes as --params_file.
topics:
  # The Livox driver's own topics, same as FAST-LIO reads. The IMU is the bias-corrected
  # stream from the imu_bias_container in localisation.launch.py.
  pointcloud: "/livox/lidar"
  imu: "/livox/imu/corrected"
  # Best-effort, which is compatible with the driver whether it publishes reliable or not.
  # A sample is only useful while it is current: a lost scan costs one update, a late scan
  # drags the estimate behind reality. Set true only if the cloud starts crossing a network.
  qos_reliable: false
  pointcloud_queue_depth: 20
  # A full second at the MID-360's 200 Hz IMU rate. The sensor-data default of 5 is 25 ms,
  # short enough that any stall in the callback thread costs samples de-skewing needs.
  imu_queue_depth: 200
calibration:
  # Read the LiDAR -> IMU extrinsic from TF at startup, as imu.frame -> lidar.frame, rather
  # than restating it here. The MID-360 datasheet offset lives on the livox_imu_joint in
  # description/urdf/sensor_mount.urdf.xacro, which is where a physical property of the
  # sensor belongs; livox_mid360.yaml still carries its own copy as mapping.extrinsic_T
  # because FAST-LIO cannot do this, and the URDF is the one both should agree with.
  #
  # This makes the robot description a hard dependency of odometry -- but it already was:
  # base.origin_at_base below cannot place the world frame without it either, so nothing new
  # has to come up first. Set it back to explicit translation / rotation vectors for a bag
  # replay, which has no live TF tree to read.
  from_tf: true
lidar:
  # Rejects returns off the robot itself. FAST-LIO calls this preprocess.blind; same 0.5 m,
  # and the same caveat: it is a sphere, so raising it blinds the robot in every direction
  # at that radius.
  min_range_m: 1.5
  # Real MID-360 range (~70 m at high reflectivity, ~40 m at 10%).
  max_range_m: 70
  # Must match the URDF link name: it is the source frame of the lidar -> base lookup that
  # the three `base` switches below need.
  frame: "livox_frame"
map:
  # The world-fixed parent of the odometry and the published clouds.
  frame: "odom"
  # BIEVR-LIO keeps an image per voxel rather than a point tree, so these are not the same
  # dial as FAST-LIO's filter_size_map. pixel_size_m is the resolution *within* a voxel
  # image; voxel_size_m is the voxel grid itself.
  pixel_size_m: 0.05
  voxel_size_m: 0.5
  normal_tolerance_deg: 3
  smooth: true
  weighted: true
  # A voxel count, not a metric extent, so it replaces both cube_side_length and the
  # ikd-Tree trimming FAST-LIO uses. Voxels past this are evicted least-recently-used first,
  # so the map degrades by forgetting where the robot has not been lately rather than by
  # failing.
  #
  # Size it by memory, not by area. Each observed voxel carries three float images of
  # (voxel_size / pixel_size)^2 pixels -- bump, smoothed and weights -- so at 0.5 m and 5 cm
  # that is 3 x 10 x 10 x 4 = 1200 bytes, plus about 470 bytes of transforms and moments and
  # the hash/LRU node: call it 1.8 kB per voxel. Upstream's 1.5M would therefore reach about
  # 2.6 GB once the map filled, which is not survivable on a Jetson sharing RAM with Nav2
  # and perception. 400k is roughly 0.7 GB and still a large area: at 0.5 m voxels, a
  # surface-only map, that is far more than a rover covers in a run.
  #
  # Raise it on a workstation, where the arithmetic above is the only limit that matters.
  max_size: 600000
preprocess:
  # The strongest accuracy dial and the most expensive one, the counterpart of FAST-LIO's
  # filter_size_surf. Give this back first if odometry cannot keep up with its input.
  #
  # Was 0.12, chosen only so the two backends spend comparable time per scan on the Jetson
  # -- parity with FAST-LIO, not a measurement of what BIEVR-LIO needs. 0.10 is upstream's
  # own default (BIEVR-LIO/config/params.yaml) and is here to fight pose jitter: coarser
  # downsampling leaves fewer residuals in the solve, and the Lunabotics arena is close to
  # the worst case for that -- a flat sand floor and low walls give little to constrain the
  # horizontal plane with, so thinning the returns costs more here than it would indoors.
  #
  # Points on a surface go as (1/res)^2, so this is about 1.4x the per-scan work. The
  # measurement in max_num_threads below had the whole pipeline holding 10 Hz on one core,
  # and there are 3, so there should be headroom -- but that was measured at 0.12. Watch
  # `ros2 topic hz /Odometry` against the 10 Hz LiDAR rate and put this back if it sags.
  downsample_resolution_m: 0.10
  informed_sampling: true
optimization:
  huber_delta: 0.1
imu:
  window_s: 10
  # Seconds of stationary data used to estimate the biases and level the world frame. The
  # robot must be still for this long at startup, exactly as FAST-LIO's gravity_align_en
  # requires.
  t_init: 0.2
  # -1 autodetects whether the accelerometer reports g or m/s^2 from the magnitude of that
  # window. The Livox IMU reports g, and the bias remover upstream does not rescale it, so
  # autodetection is what makes the units come out right; pin it to 1 if a future driver
  # change ever makes the detection ambiguous.
  normalized: -1.0
  # The IMU inside the Livox, which is what the filter actually estimates. Deliberately not
  # base_link: that pose is the IMU's, offset and rotated by the mast mounting, which
  # base.odom_in_base composes properly rather than mislabelling.
  frame: "livox_imu_frame"
base:
  frame: "base_link"
  # Report the base pose on the odometry topic so the EKF can fuse it with no transform
  # between the message's child frame and base_link. Same role as FAST-LIO's
  # publish.odom_in_base_en, and ekf_config.yaml's odom0 assumes it either way.
  odom_in_base: true
  # Put the world origin on base_link rather than on the IMU up the mast, so the ground
  # plane is near z = 0 instead of z = -0.65 for everything downstream. Position only.
  origin_at_base: true
  # And the world heading. Initialisation levels the world frame from the accelerometer,
  # which fixes roll and pitch only -- yaw is unobservable to an accelerometer -- so the
  # world frame otherwise inherits the IMU's startup yaw. The IMU sits inside the Livox,
  # which laser_joint mounts a quarter turn round, so base_link would come up exactly 90
  # degrees off odom and yank the EKF (which starts at identity) on the first message.
  # This is the same fix as FAST-LIO's common.heading_at_base_en.
  heading_at_base: true
publish:
  # No TF from the LIO: the EKF owns odom -> base_link, and two publishers on one edge make
  # lookups depend on message arrival order.
  tf: false
  # Would fight the URDF, which already parents livox_frame under base_link.
  tf_lidar: false
  # The accumulated map, on /bievr_lio/map, which localisation.launch.py remaps onto
  # /Laser_map so the base-station Draco link gets the same topic it gets from FAST-LIO.
  #
  # Measured against the simulator at map sizes up to ~60k points: publishing every second
  # cost less than the run-to-run variation in the filter's own CPU, so the export itself is
  # below the noise floor and 5 s is not a number the CPU forced. It is set here because the
  # base station has no use for a faster map, and because the cost has NOT been measured at
  # a full map -- extraction is linear in observed pixels, and 400k voxels is a couple of
  # hundred times the map that measurement covered. Watch `ros2 topic hz /Odometry` on the
  # first long drive; 0 disables the publish and leaves /map_save on demand.
  map_interval_s: 5.0
  # Emit every map pixel (5 cm spacing). This is about message size, not CPU: measured across
  # stride 1 to 4 the extraction cost barely moved, because the per-voxel walk dominates the
  # per-pixel emit. It was 2, and 2 is wrong for anything downstream that grids the map:
  # stride 2 spaces the points at 10 cm, exactly global_traversability's resolution_m, so its
  # cells averaged 1.05 points each and 74% of them fell below min_points_per_cell and were
  # published as unknown. Measured on the sim arena, 13998 points over a 114x117 cell grid:
  #
  #     stride    points    pt/cell    costmap cells with >= 2 pts
  #     2          14.0k       1.05                         25.6%
  #     1          56.0k       4.20                        ~59.6%   (= every observed cell)
  #
  # The cost is 4x the message: a full 400k-voxel map at stride 1 is on the order of 10M
  # points, over 100 MB. That is a link problem, not a rover one -- global_traversability
  # subscribes to /Laser_map on the host, and the downlink copy is voxel downsampled and
  # Draco compressed first. Raise it back to 2 only if the on-host publish itself starts to
  # hurt, and drop resolution_m in navigation.yaml to match if you do.
  map_stride: 1
  # Where /map_save writes. The counterpart of map_file_path in livox_mid360.yaml, and like
  # FAST-LIO's pcd_save_en: false, saving is on demand only -- nothing is written unless the
  # service is called.
  map_path: "~/maps/bievr_map.pcd"
debug:
  # Every one of these serialises a point cloud on the Jetson's CPU, competing with the
  # filter itself. /bievr_lio/points/registered is published unconditionally; this only
  # controls the extra fine/coarse/effective/undistorted debug clouds.
  publish_all_clouds: false
  timing: false
  log: false
  # The live status print redraws the terminal on every scan, which is noise in a launch
  # log and costs a write per frame.
  dashboard: false
  trajectory_path: ""
# Pinned rather than left at 0, which means "all cores" here (NOT what FAST-LIO's
# max_threads: 0 means -- that one leaves a core free).
#
# 0 is actively worse than a small number, not just greedier. TBB starts a worker per core
# and they spin-wait between frames, so the process burned 0.47-0.61 cores on a 28-thread
# desktop; pinned to a single core it burned 0.30 and published /Odometry at the same rate.
# The extra was spin, not work. On a Jetson that spin competes with Nav2 for cores the
# filter is not using anyway.
#
# 3 leaves headroom on a 6-core board and is well above what the measurement says is needed:
# the whole pipeline held 10 Hz on one 3.9 GHz core with a 23k-point scan, which is the
# point rate the real MID-360 produces. Raise it if `ros2 topic hz /Odometry` falls below
# the LiDAR rate.
max_num_threads: 3
