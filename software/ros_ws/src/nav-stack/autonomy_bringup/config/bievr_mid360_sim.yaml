# BIEVR-LIO against Gazebo: the deltas from bievr_mid360.yaml, and nothing else.
#
# A separate file rather than a rewritten copy, because BIEVR-LIO already layers two configs
# and merges them per leaf key -- localisation.launch.py passes the real-robot file as
# --params_file and this one as --sensor_config_file when sim:=true, so the keys below win
# and every key not mentioned here keeps its real-robot value. That is also why there is no
# counterpart to FAST-LIO's sim_overrides(): the layering does the same job without a temp
# file.
#
# The sensor being modelled is the gpu_lidar and imu in perseus_simulation's
# perseus_description/urdf/sensors.urdf.xacro -- the simulator is a separate workspace, and
# this repo's own description/urdf/sensors.urdf.xacro is NOT what Gazebo runs. Where the two
# disagree, this file follows the simulator.
lidar:
  # The reason this file has to exist. The gz bridge publishes x, y, z, intensity, ring and
  # no per-point time field, so without this every cloud is rejected and the node comes up
  # and then does nothing. It is not a fudge here: a gpu_lidar renders the whole scan in one
  # pass, so the scan really is instantaneous and zero offsets are the correct reading.
  # Undistortion still runs and resolves to the identity.
  allow_untimed: true
  # The <range><max> of the simulated sensor, against ~70 m for the real MID-360. Points
  # beyond it never appear, so this only saves the filter from carrying a range it will
  # never see.
  max_range_m: 40
# calibration is deliberately absent: the simulator now models the LiDAR-IMU offset the
# same way the robot does. perseus_simulation's perseus_description carries the same
# livox_imu_joint as this repo's description package, and its Gazebo imu sensor is attached
# to livox_imu_frame rather than sitting on livox_frame, so bievr_mid360.yaml's
# calibration.from_tf resolves here to the same extrinsic it resolves to on the robot.
#
# If that ever stops being true -- an older perseus_simulation checkout, say -- the symptom
# is the node holding at "Waiting for the livox_imu_frame -> livox_frame transform" and
# publishing nothing. The fix is to state it here explicitly instead:
#
#   calibration:
#     from_tf: false
#     translation: [0.0, 0.0, 0.0]      # identity: the sim IMU used to sit on livox_frame
#     rotation: [1., 0., 0., 0., 1., 0., 0., 0., 1.]
