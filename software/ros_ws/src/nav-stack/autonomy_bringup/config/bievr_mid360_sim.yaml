# BIEVR-LIO against Gazebo: the deltas from bievr_mid360.yaml, and nothing else.
#
# A separate file rather than a rewritten copy, because BIEVR-LIO already layers two configs
# and merges them per leaf key -- localisation.launch.py passes the real-robot file as
# --params_file and this one as --sensor_config_file, so the keys below win and every key
# not mentioned here keeps its real-robot value. That is also why there is no counterpart to
# FAST-LIO's sim_overrides(): the layering does the same job without a temp file.
#
# The sensor being modelled is the gpu_lidar and imu in description/urdf/sensors.urdf.xacro,
# not a MID-360. Where they disagree, this file follows the URDF.
lidar:
  # The reason this file has to exist. The gz bridge publishes x, y, z, intensity, ring and
  # no per-point time field, so without this every cloud is rejected and the node comes up
  # and then does nothing. It is not a fudge here: a gpu_lidar renders the whole scan in one
  # pass, so the scan really is instantaneous and zero offsets are the correct reading.
  # Undistortion still runs and resolves to the identity.
  allow_untimed: true
  # The <range><max> of the simulated sensor, against ~70 m for the real MID-360. Points
  # beyond it never appear, so this only saves the filter from carrying a range it will
  # never see.
  max_range_m: 30
imu:
  # The simulated IMU runs at 10 Hz (<update_rate> on lidar_imu), against 200 Hz on the real
  # MID-360. 0.2 s of it is two samples to estimate the biases and level the world frame
  # from; 0.5 s gives the initialiser something to average. The robot still has to be
  # stationary for that long at startup.
  t_init: 0.5
