/**/controller_manager:
  ros__parameters:
    update_rate: 20 # Hz
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    # Position setpoints go to CAN as SET_POSITION; the board's own PID servos to them.
    bucket_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    # Single-axis controllers for bring-up: each claims one joint, so the other
    # two banks receive no SET_POSITION frames.
    bucket_lift_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    bucket_tilt_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    bucket_jaw_controller:
      type: joint_trajectory_controller/JointTrajectoryController
/**/bucket_lift_controller:
  ros__parameters:
    joints:
      - bucket_lift_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    # Without these a goal reports SUCCEEDED when its time runs out, even if the
    # bucket never moved. 0.035 rad = 2 deg.
    constraints:
      goal_time: 3.0
      bucket_lift_joint:
        goal: 0.035
/**/bucket_tilt_controller:
  ros__parameters:
    joints:
      - bucket_tilt_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    constraints:
      goal_time: 3.0
      bucket_tilt_joint:
        goal: 0.035
/**/bucket_jaw_controller:
  ros__parameters:
    joints:
      - bucket_jaw_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    constraints:
      goal_time: 3.0
      bucket_jaw_joint:
        goal: 0.035
/**/bucket_trajectory_controller:
  ros__parameters:
    joints:
      - bucket_lift_joint
      - bucket_tilt_joint
      - bucket_jaw_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: true
    constraints:
      goal_time: 3.0
      bucket_lift_joint:
        goal: 0.035
      bucket_tilt_joint:
        goal: 0.035
      bucket_jaw_joint:
        goal: 0.035
