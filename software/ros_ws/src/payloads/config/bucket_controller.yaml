/**/controller_manager:
  ros__parameters:
    update_rate: 20 # Hz
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    # Position setpoints go to CAN as SET_POSITION; the board's own PID servos to them.
    bucket_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
/**/bucket_trajectory_controller:
  ros__parameters:
    joints:
      - bucket_lift_joint
      - bucket_tilt_joint
      - bucket_jaw_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: true
