# The bucket's controllers. Loaded into the rover's one controller_manager by
# perseus/launch/controllers.launch.py when payload:=bucket, and into the bench
# controller_manager by bucket.launch.py. No update_rate here: on the rover it would
# override the drive's 50 Hz. The bucket's hardware runs at its own rw_rate (20 Hz,
# bucket.ros2_control.xacro), and bucket.launch.py sets 20 Hz for the bench.
/**/controller_manager:
  ros__parameters:
    # Read-only, and limited to the bucket joints: the drive has its own broadcaster,
    # so a bucket fault (which deactivates every controller tied to the bucket's
    # interfaces) leaves the wheel joint states running.
    bucket_joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    # The ten ram joints, solved from lift/tilt/jaw each cycle; see
    # payloads/include/bucket_linkage/bucket_linkage.hpp.
    bucket_linkage_broadcaster:
      type: payloads/BucketLinkageBroadcaster
    # Position setpoints go to CAN as SET_POSITION; the board's own PID servos to them.
    bucket_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    # Single-axis controllers for bring-up: each claims one joint, so the other
    # two banks receive no SET_POSITION frames.
    bucket_lift_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    bucket_tilt_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    bucket_jaw_controller:
      type: joint_trajectory_controller/JointTrajectoryController
/**/bucket_joint_state_broadcaster:
  ros__parameters:
    joints:
      - bucket_lift_joint
      - bucket_tilt_joint
      - bucket_jaw_joint
    interfaces:
      - position
      - velocity
      - effort
/**/bucket_linkage_broadcaster:
  ros__parameters:
    lift_joint: bucket_lift_joint
    tilt_joint: bucket_tilt_joint
    jaw_joint: bucket_jaw_joint
    publish_rate: 20.0
/**/bucket_lift_controller:
  ros__parameters:
    joints:
      - bucket_lift_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    # Without these a goal reports SUCCEEDED when its time runs out, even if the
    # bucket never moved. 0.035 rad = 2 deg.
    constraints:
      goal_time: 3.0
      bucket_lift_joint:
        goal: 0.035
/**/bucket_tilt_controller:
  ros__parameters:
    joints:
      - bucket_tilt_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    constraints:
      goal_time: 3.0
      bucket_tilt_joint:
        goal: 0.035
/**/bucket_jaw_controller:
  ros__parameters:
    joints:
      - bucket_jaw_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    constraints:
      goal_time: 3.0
      bucket_jaw_joint:
        goal: 0.035
/**/bucket_trajectory_controller:
  ros__parameters:
    joints:
      - bucket_lift_joint
      - bucket_tilt_joint
      - bucket_jaw_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: true
    constraints:
      goal_time: 3.0
      bucket_lift_joint:
        goal: 0.035
      bucket_tilt_joint:
        goal: 0.035
      bucket_jaw_joint:
        goal: 0.035
